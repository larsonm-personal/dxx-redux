name: Server Rust checks

# Always emit the server check; a job-level gate reports omitted PR work as skipped
on:
  pull_request:
  push:
    branches: [cmake]

permissions:
  contents: read

concurrency:
  group: server-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    uses: ./.github/workflows/stack-ci.yml
    with:
      profile: rust

  server:
    needs: stack
    if: needs.stack.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect server changes
        id: changes
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.event.after }}
          DELETED: ${{ github.event.deleted }}
        run: |
          # PR admission already used fresh native metadata and the full stack diff
          # Once admitted, run the real tests even if a new top is added meanwhile
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$DELETED" == true ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            BASE=$(git hash-object -t tree --stdin </dev/null)
          else
            git cat-file -e "$BASE^{commit}" || git fetch --no-tags --depth=1 origin "$BASE"
          fi
          # Pushes retain their before/after snapshot comparison
          status=0
          git diff --quiet --no-renames "$BASE" "$HEAD" -- server/ || status=$?
          case "$status" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: No server changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "No server changes; Rust installation, build and tests skipped"
      - name: Install declared compiler and components
        if: steps.changes.outputs.changed == 'true'
        run: bash android/get_deps/helpers/get_rust.sh
      - name: Build and test locked dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: server
        run: |
          cargo build --locked
          cargo test --locked
          cargo clippy --locked --all-targets
          cargo fmt --check
