name: Public runtime integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-save-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-public:
    name: Linux public build and save integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native dependencies
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libphysfs-dev libsdl1.2-dev \
            libsdl-mixer1.2-dev libpng-dev libglew-dev zlib1g-dev \
            xvfb xauth libgl1-mesa-dri

      - name: Prepare native test workspace
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-public-deps"
          printf '%s\n' "$RUNNER_TEMP/dxx-public-deps" > dependency_base.txt

      - name: Check save evidence admission
        timeout-minutes: 1
        shell: pwsh
        run: ./android/tests/test_wall_blast_save_profiles.ps1

      - name: Build both real native save fixtures
        timeout-minutes: 20
        run: |
          for game in d1 d2; do
            cmake -S "$game" -B "build${game}-save" -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_FLAGS_DEBUG="-O1 -g1" -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g1"
            cmake --build "build${game}-save" --target test_upstream_compat "dxx-redux-${game}" "dxx-redux-${game}-headless" --parallel 4
          done

      - name: Verify the CI-only optimized Debug profile keeps assertions and precise math
        run: |
          python3 - <<'PYTHON'
          import json
          import shlex
          from pathlib import Path
          for game in ("d1", "d2"):
              build = Path(f"build{game}-save")
              assert "CMAKE_BUILD_TYPE:STRING=Debug" in (build / "CMakeCache.txt").read_text()
              commands = json.loads((build / "compile_commands.json").read_text())
              for target in (f"dxx-redux-{game}", f"dxx-redux-{game}-headless", "test_upstream_compat"):
                  selected = [row for row in commands if f"/{target}.dir/" in row["command"]]
                  assert selected, (game, target, "missing compilation commands")
                  for row in selected:
                      flags = shlex.split(row["command"])
                      assert [flag for flag in flags if flag.startswith("-O")] == ["-O1"], row
                      assert "-g1" in flags and not any(flag.startswith("-DNDEBUG") for flag in flags), row
                      assert "-ffp-contract=off" in flags and "-fno-fast-math" in flags, row
                  print(f"{game}/{target}: {len(selected)} Debug commands retain assertions and precise math")
          PYTHON

      - name: Build public Guide-Bot arrival fixture
        timeout-minutes: 10
        run: cmake --build buildd2-save --target test_guidebot_live_navigation --parallel 4

      - name: Check headless audio shutdown on success and early failure
        timeout-minutes: 1
        run: |
          for game in d1 d2; do
            env -u DISPLAY -u WAYLAND_DISPLAY SDL_VIDEODRIVER=invalid \
              ctest --test-dir "build${game}-save" -R '^test_headless_audio_lifecycle$' --output-on-failure --no-tests=error
          done

      - name: Prepare pinned public shareware data
        timeout-minutes: 5
        shell: pwsh
        run: ./android/helpers/setup_shareware_test_data.ps1 -Game both -Download

      - name: Qualify native ordered input phases and causal failures
        timeout-minutes: 12
        run: |
          python3 android/tests/test_ordered_public_replay.py
          python3 android/tests/test_convert_public_replay.py
          xvfb-run -a -s '-screen 0 640x480x24 -noreset' \
            pwsh -NoProfile -File android/tests/test_ordered_input_runtime.ps1 \
            -D1Exe "$PWD/buildd1-save/main/test_upstream_compat" \
            -D2Exe "$PWD/buildd2-save/main/test_upstream_compat" \
            -D1Headless "$PWD/buildd1-save/main/dxx-redux-d1-headless" \
            -D2Headless "$PWD/buildd2-save/main/dxx-redux-d2-headless" \
            -D1Graphics "$PWD/buildd1-save/main/d1x-redux" \
            -D2Graphics "$PWD/buildd2-save/main/d2x-redux" \
            -D1DataDir "$PWD/game_data/shareware/d1" -D2DataDir "$PWD/game_data/shareware/d2" \
            -Output "$PWD/temp/ordered-input-runtime-ci"

      - name: Qualify live all-weapons grants and immutable compact oracles
        timeout-minutes: 7
        run: |
          python3 android/tests/test_check_all_weapons_runtime.py
          xvfb-run -a -s '-screen 0 640x480x24 -noreset' \
            pwsh -NoProfile -File android/tests/test_all_weapons_runtime.ps1 \
            -D1BuildDir "$PWD/buildd1-save" -D2BuildDir "$PWD/buildd2-save" \
            -D1DataDir "$PWD/game_data/shareware/d1" -D2DataDir "$PWD/game_data/shareware/d2" \
            -Output "$PWD/temp/all-weapons-runtime-ci" -Revision "$(git rev-parse HEAD)"

      - name: Check truthful public Guide-Bot objective arrival without video
        timeout-minutes: 3
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY SDL_VIDEODRIVER=invalid \
            pwsh -NoProfile -File android/tests/test_guidebot_live_navigation.ps1 \
            -NoBuild -PublicDemo -BuildDir buildd2-save -HogDir "$PWD/game_data/shareware/d2"

      - name: Prove actual public matcen production and suppression without video
        timeout-minutes: 3
        run: |
          python3 android/tests/test_public_matcen_report.py
          env -u DISPLAY -u WAYLAND_DISPLAY SDL_VIDEODRIVER=invalid \
            pwsh -NoProfile -File android/tests/test_public_matcen_stations.ps1 \
            -D1Exe "$PWD/buildd1-save/main/test_upstream_compat" \
            -D2Exe "$PWD/buildd2-save/main/test_upstream_compat" \
            -D1DataDir "$PWD/game_data/shareware/d1" -D2DataDir "$PWD/game_data/shareware/d2" \
            -Output "$PWD/temp/public-matcen-ci"

      - name: Exercise native saves, endian restores and imported checkpoints
        timeout-minutes: 5
        run: |
          xvfb-run -a pwsh -NoProfile -File android/tests/test_d1_wall_blast_save.ps1 \
            -DataEdition shareware \
            -NativeExe "$PWD/buildd1-save/main/test_upstream_compat" \
            -ImportedExe "$PWD/buildd2-save/main/test_upstream_compat"

      - name: Qualify runtime-generated ordinary save persistence
        timeout-minutes: 12
        run: |
          pwsh -NoProfile -File android/tests/test_public_save_profiles.ps1
          xvfb-run -a pwsh -NoProfile -File android/tests/test_public_save_continuation.ps1 \
            -D1Exe "$PWD/buildd1-save/main/test_upstream_compat" \
            -D2Exe "$PWD/buildd2-save/main/test_upstream_compat" \
            -Output "$PWD/temp/public-save-continuation-ci"

      - name: Exercise public loaded-asset pickup matrix
        timeout-minutes: 5
        run: |
          pwsh -NoProfile -File android/tests/test_pickup_autoselect_profiles.ps1
          xvfb-run -a pwsh -NoProfile -File android/tests/test_pickup_autoselect_parity.ps1 \
            -DataEdition shareware \
            -NativeExe "$PWD/buildd1-save/main/test_upstream_compat" \
            -ImportedExe "$PWD/buildd2-save/main/test_upstream_compat" \
            -Output "$PWD/temp/public-pickup-ci"

      - name: Exercise public loaded-asset combat rules
        timeout-minutes: 5
        run: |
          pwsh -NoProfile -File android/tests/test_public_combat_profiles.ps1
          xvfb-run -a pwsh -NoProfile -File android/helpers/test_d1_gameplay_rules.ps1 \
            -DataEdition shareware \
            -NativeExecutable "$PWD/buildd1-save/main/test_upstream_compat" \
            -ImportedExecutable "$PWD/buildd2-save/main/test_upstream_compat" \
            -Output "$PWD/temp/public-combat-ci"

      - name: Render and verify compact combat capture screenshots
        timeout-minutes: 3
        run: |
          DXX_PUBLIC_CAPTURE_SCREENSHOTS=1 xvfb-run -a -s '-screen 0 640x480x24 -noreset' \
            python3 android/tests/capture_compact_public_replays.py \
            --repo "$PWD" --output "$PWD/temp/public-robot-combat-visual-ci" \
            --capture-d1 "$PWD/buildd1-save/main/test_upstream_compat" \
            --capture-d2 "$PWD/buildd2-save/main/test_upstream_compat" \
            --data-d1 "$PWD/game_data/shareware/d1" --data-d2 "$PWD/game_data/shareware/d2" \
            --engine-revision "$(git rev-parse HEAD)" --scenario combat
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          captured = Path("temp/public-robot-combat-visual-ci")
          admitted = Path("android/tests/fixtures/public_level_replays")
          for game in ("d1", "d2"):
              name = f"{game}-public-combat.oracle.json"
              actual = json.loads((captured / name).read_bytes())
              expected = json.loads((admitted / name).read_bytes())
              for key in ("frames", "frame_sha256", "simulation_rng_events", "simulation_rng_sha256",
                          "terminal_sha256", "combat_observations"):
                  assert actual[key] == expected[key], (game, key)
              directory = captured / f"{game}-combat"
              report = json.loads((directory / "capture.json").read_bytes())
              frames = report["screenshot_frames"]
              assert frames == sorted(set(frames))
              assert {0, report["damage_frame"], report["action_frame"]} <= set(frames)
              images = sorted((directory / "screenshots").glob("scrn*.png"))
              assert len(images) == len(frames) and all(path.stat().st_size for path in images)
          PYTHON

      - name: Render and verify compact door lifecycle screenshots
        timeout-minutes: 3
        run: |
          DXX_PUBLIC_CAPTURE_SCREENSHOTS=1 xvfb-run -a -s '-screen 0 640x480x24 -noreset' \
            python3 android/tests/capture_compact_public_replays.py \
            --repo "$PWD" --output "$PWD/temp/public-door-lifecycle-visual-ci" \
            --capture-d1 "$PWD/buildd1-save/main/test_upstream_compat" \
            --capture-d2 "$PWD/buildd2-save/main/test_upstream_compat" \
            --data-d1 "$PWD/game_data/shareware/d1" --data-d2 "$PWD/game_data/shareware/d2" \
            --engine-revision "$(git rev-parse HEAD)" --scenario door-lifecycle
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          captured = Path("temp/public-door-lifecycle-visual-ci")
          admitted = Path("android/tests/fixtures/public_level_replays")
          for game in ("d1", "d2"):
              name = f"{game}-public-door-lifecycle.oracle.json"
              actual = json.loads((captured / name).read_bytes())
              expected = json.loads((admitted / name).read_bytes())
              for key in ("frames", "frame_sha256", "simulation_rng_events", "simulation_rng_sha256",
                          "terminal_sha256", "door_observations"):
                  assert actual[key] == expected[key], (game, key)
              directory = captured / f"{game}-door-lifecycle"
              report = json.loads((directory / "capture.json").read_bytes())
              frames = report["screenshot_frames"]
              assert frames == sorted(set(frames))
              assert {row["f"] for row in report["door_events"]} <= set(frames)
              images = sorted((directory / "screenshots").glob("scrn*.png"))
              assert len(images) == len(frames) and all(path.stat().st_size for path in images)
          PYTHON

      - name: Render and verify authored robot-loot capture
        timeout-minutes: 3
        run: |
          DXX_PUBLIC_CAPTURE_SCREENSHOTS=1 xvfb-run -a -s '-screen 0 640x480x24 -noreset' \
            python3 android/tests/capture_compact_public_replays.py \
            --repo "$PWD" --output "$PWD/temp/public-robot-loot-visual-ci" \
            --capture-d1 "$PWD/buildd1-save/main/test_upstream_compat" \
            --capture-d2 "$PWD/buildd2-save/main/test_upstream_compat" \
            --data-d1 "$PWD/game_data/shareware/d1" --data-d2 "$PWD/game_data/shareware/d2" \
            --engine-revision "$(git rev-parse HEAD)" --scenario loot
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          captured = Path("temp/public-robot-loot-visual-ci")
          name = "d1-public-loot.oracle.json"
          actual = json.loads((captured / name).read_bytes())
          expected = json.loads((Path("android/tests/fixtures/public_level_replays") / name).read_bytes())
          for key in ("frames", "frame_sha256", "simulation_rng_events", "simulation_rng_sha256",
                      "terminal_sha256", "combat_observations"):
              assert actual[key] == expected[key], key
          directory = captured / "d1-loot"
          report = json.loads((directory / "capture.json").read_bytes())
          frames = report["screenshot_frames"]
          assert frames == sorted(set(frames))
          assert {0, report["damage_frame"], report["action_frame"], report["pickup_frame"]} <= set(frames)
          images = sorted((directory / "screenshots").glob("scrn*.png"))
          assert len(images) == len(frames) and all(path.stat().st_size for path in images)
          PYTHON

      - name: Render and verify ordinary-start Guide-Bot cage release
        timeout-minutes: 3
        run: |
          DXX_PUBLIC_CAPTURE_SCREENSHOTS=1 xvfb-run -a -s '-screen 0 640x480x24 -noreset' \
            python3 android/tests/capture_compact_public_replays.py \
            --repo "$PWD" --output "$PWD/temp/public-guidebot-visual-ci" \
            --capture-d1 "$PWD/buildd1-save/main/test_upstream_compat" \
            --capture-d2 "$PWD/buildd2-save/main/test_upstream_compat" \
            --data-d1 "$PWD/game_data/shareware/d1" --data-d2 "$PWD/game_data/shareware/d2" \
            --engine-revision "$(git rev-parse HEAD)" --scenario guidebot-release
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          captured = Path("temp/public-guidebot-visual-ci")
          admitted = Path("android/tests/fixtures/public_level_replays")
          name = "d2-public-guidebot-release.oracle.json"
          actual = json.loads((captured / name).read_bytes())
          expected = json.loads((admitted / name).read_bytes())
          for key in ("frames", "frame_sha256", "simulation_rng_events", "simulation_rng_sha256",
                      "terminal_sha256", "guidebot_observations"):
              assert actual[key] == expected[key], key
          directory = captured / "d2-guidebot-release"
          report = json.loads((directory / "capture.json").read_bytes())
          frames = report["screenshot_frames"]
          assert frames == sorted(set(frames))
          assert {0, report["damage_frame"], report["blast_frame"], report["action_frame"], report["passage_frame"]} <= set(frames)
          images = sorted((directory / "screenshots").glob("scrn*.png"))
          assert len(images) == len(frames) and all(path.stat().st_size for path in images)
          PYTHON

      - name: Package exact replay binaries and pinned public assets
        run: |
          mkdir -p "$RUNNER_TEMP/public-replay-build"
          git rev-parse HEAD > "$RUNNER_TEMP/public-replay-build/source-commit.txt"
          paths=(buildd1-save/main/d1x-redux buildd2-save/main/d2x-redux
                 buildd1-save/main/dxx-redux-d1-headless buildd2-save/main/dxx-redux-d2-headless)
          sha256sum "${paths[@]}" > "$RUNNER_TEMP/public-replay-build/binaries.sha256"
          tar -czf "$RUNNER_TEMP/public-replay-build/runtime.tgz" "${paths[@]}" game_data/shareware

      - name: Share the verified build with both replay backends
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-replay-build
          path: ${{ runner.temp }}/public-replay-build/
          retention-days: 3
          if-no-files-found: error

      # Keep the small review surface downloadable when complete traces exceed
      # the artifact client's download limit; the full evidence below is retained
      - name: Keep save integrity reports and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-save-reports
          path: |
            temp/wall-blast-save-shareware/**/*.json
            temp/wall-blast-save-shareware/**/*.log
            temp/wall-blast-save-shareware/**/*.txt
            temp/wall-blast-save-shareware/**/*.png
            temp/public-*-ci/**/*.json
            temp/public-*-ci/**/*.log
            temp/public-*-ci/**/*.txt
            temp/public-*-ci/**/*.png
            android/temp/guidebot_live_navigation/**/*.json
            android/temp/guidebot_live_navigation/**/*.log
            android/temp/guidebot_live_navigation/**/*.txt
            android/temp/guidebot_live_navigation/**/*.png
            android/temp/wall-blast-profiles/**/*.json
            android/temp/wall-blast-profiles/**/*.log
            android/temp/wall-blast-profiles/**/*.txt
            android/temp/wall-blast-profiles/**/*.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Keep save integrity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-save-integrity
          path: |
            temp/wall-blast-save-shareware/
            temp/public-pickup-ci/
            temp/public-save-continuation-ci/
            temp/public-combat-ci/
            temp/public-robot-combat-visual-ci/
            temp/public-guidebot-visual-ci/
            android/temp/guidebot_live_navigation/
            temp/public-robot-loot-visual-ci/
            temp/public-door-lifecycle-visual-ci/
            temp/public-matcen-ci/
            temp/ordered-input-runtime-ci/
            temp/all-weapons-runtime-ci/
            android/temp/wall-blast-profiles/
            buildd1-save/CMakeFiles/CMakeConfigureLog.yaml
            buildd1-save/CMakeCache.txt
            buildd1-save/compile_commands.json
            buildd2-save/CMakeFiles/CMakeConfigureLog.yaml
            buildd2-save/CMakeCache.txt
            buildd2-save/compile_commands.json
          retention-days: 3
          if-no-files-found: ignore

  save-integrity:
    name: Linux public native save and replay integrity
    timeout-minutes: 90
    needs: build-public
    runs-on: ubuntu-24.04
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: invalid
      LIBGL_ALWAYS_SOFTWARE: "1"
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native runtime and test tools
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libphysfs-dev libsdl1.2-dev libsdl-mixer1.2-dev \
            libpng-dev libglew-dev zlib1g-dev xvfb xauth libgl1-mesa-dri

      - name: Prepare host helper workspace
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-public-runtime-deps"
          printf '%s\n' "$RUNNER_TEMP/dxx-public-runtime-deps" > dependency_base.txt

      - name: Download this workflow's exact replay build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: public-replay-build
          path: ${{ runner.temp }}/public-replay-build

      - name: Verify build identity and restore executable permissions
        run: |
          test "$(cat "$RUNNER_TEMP/public-replay-build/source-commit.txt")" = "$(git rev-parse HEAD)"
          tar -xzf "$RUNNER_TEMP/public-replay-build/runtime.tgz"
          sha256sum -c "$RUNNER_TEMP/public-replay-build/binaries.sha256"
          test -x buildd1-save/main/d1x-redux
          test -x buildd2-save/main/d2x-redux
          test -x buildd1-save/main/dxx-redux-d1-headless
          test -x buildd2-save/main/dxx-redux-d2-headless
          for binary in buildd{1,2}-save/main/*; do
            ldd "$binary" | tee "$RUNNER_TEMP/$(basename "$binary").ldd"
            if grep -q 'not found' "$RUNNER_TEMP/$(basename "$binary").ldd"; then
              echo "Missing shared dependency for $binary" >&2
              exit 1
            fi
          done

      - name: Check compact public replay admission
        timeout-minutes: 4
        run: |
          python3 android/tests/test_ordered_public_replay.py
          python3 android/tests/test_convert_public_replay.py
          python3 android/tests/test_public_secondary_replay.py
          python3 android/tests/test_compact_public_replay.py
          python3 android/tests/test_run_compact_public_replays.py
          python3 android/tests/test_public_switch_replay.py
          python3 android/tests/test_public_robot_combat_replay.py
          python3 android/tests/test_public_guidebot_replay.py
          python3 android/tests/test_public_loot_replay.py
          python3 android/tests/test_public_door_replay.py
          python3 android/tests/test_public_incoming_robot_hits.py
          python3 android/tests/test_compact_public_gameplay_parity.py
          pwsh -NoProfile -File android/tests/test_input_demo_host_build_guard.ps1
          pwsh -NoProfile -File android/tests/test_input_demo_comparison_policy.ps1
          pwsh -NoProfile -File android/tests/test_input_demo_replay_failures.ps1
          pwsh -NoProfile -File android/tests/test_validate_automation_catalog.ps1
          pwsh -NoProfile -File android/tests/test_run_all_tests_catalog.ps1

      - name: Qualify compact public replays without a display
        # Primary native gate: actual console mains, no X server or OpenGL context
        # Nine cases took 33 minutes; retain headroom for thirteen cases plus the focused no-collect controls
        timeout-minutes: 80
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY SDL_VIDEODRIVER=invalid \
            pwsh -NoProfile -File android/tests/test_input_demo_regressions.ps1 \
            -Corpus public -RunMode headless \
            -D1Exe "$PWD/buildd1-save/main/dxx-redux-d1-headless" \
            -D2Exe "$PWD/buildd2-save/main/dxx-redux-d2-headless" \
            -ResultArchiveRoot "$PWD/temp/public-replay-headless-ci"
          env -u DISPLAY -u WAYLAND_DISPLAY SDL_VIDEODRIVER=invalid \
            pwsh -NoProfile -File android/tests/test_compact_public_replay_failures.ps1 \
            -RunMode headless \
            -D1Exe "$PWD/buildd1-save/main/dxx-redux-d1-headless" \
            -D2Exe "$PWD/buildd2-save/main/dxx-redux-d2-headless" \
            -Output "$PWD/temp/public-replay-headless-negative-ci" -TimeoutSeconds 180

      # Keep the small review surface downloadable when complete traces exceed
      # the artifact client's download limit; the full evidence below is retained
      - name: Keep primary headless replay reports and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-headless-replay-reports
          path: |
            temp/public-replay-headless-ci/**/*.json
            temp/public-replay-headless-ci/**/*.log
            temp/public-replay-headless-ci/**/*.txt
            temp/public-replay-headless-ci/**/*.png
            temp/public-replay-headless-negative-ci/**/*.json
            temp/public-replay-headless-negative-ci/**/*.log
            temp/public-replay-headless-negative-ci/**/*.txt
            temp/public-replay-headless-negative-ci/**/*.png
            temp/input_demo_replay_failures_*/**/*.json
            temp/input_demo_replay_failures_*/**/*.log
            temp/input_demo_replay_failures_*/**/*.txt
            temp/input_demo_replay_failures_*/**/*.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Keep primary headless replay evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-headless-replay-integrity
          path: |
            temp/public-replay-headless-ci/
            temp/public-replay-headless-negative-ci/
            temp/input_demo_replay_failures_*/
          retention-days: 3
          if-no-files-found: ignore

  headed-replay:
    name: Linux public headed replay parity
    timeout-minutes: 120
    needs: build-public
    runs-on: ubuntu-24.04
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native runtime and test tools
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libphysfs-dev libsdl1.2-dev libsdl-mixer1.2-dev \
            libpng-dev libglew-dev zlib1g-dev xvfb xauth libgl1-mesa-dri

      - name: Prepare host helper workspace
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-public-runtime-deps"
          printf '%s\n' "$RUNNER_TEMP/dxx-public-runtime-deps" > dependency_base.txt

      - name: Download this workflow's exact replay build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: public-replay-build
          path: ${{ runner.temp }}/public-replay-build

      - name: Verify build identity and restore executable permissions
        run: |
          test "$(cat "$RUNNER_TEMP/public-replay-build/source-commit.txt")" = "$(git rev-parse HEAD)"
          tar -xzf "$RUNNER_TEMP/public-replay-build/runtime.tgz"
          sha256sum -c "$RUNNER_TEMP/public-replay-build/binaries.sha256"
          test -x buildd1-save/main/d1x-redux
          test -x buildd2-save/main/d2x-redux
          test -x buildd1-save/main/dxx-redux-d1-headless
          test -x buildd2-save/main/dxx-redux-d2-headless
          for binary in buildd{1,2}-save/main/*; do
            ldd "$binary" | tee "$RUNNER_TEMP/$(basename "$binary").ldd"
            if grep -q 'not found' "$RUNNER_TEMP/$(basename "$binary").ldd"; then
              echo "Missing shared dependency for $binary" >&2
              exit 1
            fi
          done

      - name: Qualify headed rendering and existing imported parity
        # Secondary visual fidelity gate, using the same immutable capture oracles
        timeout-minutes: 110
        run: |
          xvfb-run -a -s '-screen 0 640x480x24 -noreset' \
            pwsh -NoProfile -File android/tests/test_input_demo_regressions_graphics.ps1 \
            -Corpus public \
            -D1Exe "$PWD/buildd1-save/main/d1x-redux" \
            -D2Exe "$PWD/buildd2-save/main/d2x-redux" \
            -ResultArchiveRoot "$PWD/temp/public-replay-graphics-ci"
          xvfb-run -a -s '-screen 0 640x480x24 -noreset' \
            pwsh -NoProfile -File android/tests/test_compact_public_replay_failures.ps1 \
            -RunMode graphics \
            -D1Exe "$PWD/buildd1-save/main/d1x-redux" \
            -D2Exe "$PWD/buildd2-save/main/d2x-redux" \
            -Output "$PWD/temp/public-replay-graphics-negative-ci" -TimeoutSeconds 180

      # Keep the small review surface downloadable when complete traces exceed
      # the artifact client's download limit; the full evidence below is retained
      - name: Keep secondary headed replay reports and screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-headed-replay-reports
          path: |
            temp/public-replay-graphics-ci/**/*.json
            temp/public-replay-graphics-ci/**/*.log
            temp/public-replay-graphics-ci/**/*.txt
            temp/public-replay-graphics-ci/**/*.png
            temp/public-replay-graphics-negative-ci/**/*.json
            temp/public-replay-graphics-negative-ci/**/*.log
            temp/public-replay-graphics-negative-ci/**/*.txt
            temp/public-replay-graphics-negative-ci/**/*.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Keep secondary headed replay evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-headed-replay-integrity
          path: |
            temp/public-replay-graphics-ci/
            temp/public-replay-graphics-negative-ci/
          retention-days: 3
          if-no-files-found: ignore
