name: Public runtime integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-save-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  save-integrity:
    name: Linux public native save and replay integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native dependencies
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libphysfs-dev libsdl1.2-dev \
            libsdl-mixer1.2-dev libpng-dev libglew-dev zlib1g-dev \
            xvfb xauth libgl1-mesa-dri

      - name: Prepare native test workspace
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-public-deps"
          printf '%s\n' "$RUNNER_TEMP/dxx-public-deps" > dependency_base.txt

      - name: Check save evidence admission
        timeout-minutes: 1
        shell: pwsh
        run: ./android/tests/test_wall_blast_save_profiles.ps1

      - name: Build both real native save fixtures
        timeout-minutes: 20
        run: |
          for game in d1 d2; do
            cmake -S "$game" -B "build${game}-save" -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
              -DCMAKE_C_FLAGS_DEBUG="-O0 -g1" -DCMAKE_CXX_FLAGS_DEBUG="-O0 -g1"
            cmake --build "build${game}-save" --target test_upstream_compat "dxx-redux-${game}" --parallel 4
          done

      - name: Prepare pinned public shareware data
        timeout-minutes: 5
        shell: pwsh
        run: ./android/helpers/setup_shareware_test_data.ps1 -Game both -Download

      - name: Exercise native saves, endian restores and imported checkpoints
        timeout-minutes: 5
        run: |
          xvfb-run -a pwsh -NoProfile -File android/tests/test_d1_wall_blast_save.ps1 \
            -DataEdition shareware \
            -NativeExe "$PWD/buildd1-save/main/test_upstream_compat" \
            -ImportedExe "$PWD/buildd2-save/main/test_upstream_compat"

      - name: Check compact public replay admission
        timeout-minutes: 2
        run: |
          python3 android/tests/test_compact_public_replay.py
          python3 android/tests/test_run_compact_public_replays.py
          python3 android/tests/test_compact_public_gameplay_parity.py
          pwsh -NoProfile -File android/tests/test_validate_automation_catalog.ps1
          pwsh -NoProfile -File android/tests/test_run_all_tests_catalog.ps1

      - name: Replay compact public level starts
        timeout-minutes: 20
        run: |
          xvfb-run -a -s '-screen 0 640x480x24 -noreset' pwsh -NoProfile -File android/tests/test_compact_public_replays.ps1 \
            -D1Exe "$PWD/buildd1-save/main/d1x-redux" \
            -D2Exe "$PWD/buildd2-save/main/d2x-redux" \
            -Output "$PWD/temp/public-replay-ci"

      - name: Keep save integrity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-save-integrity
          path: |
            temp/wall-blast-save-shareware/
            temp/public-replay-ci/
            android/temp/wall-blast-profiles/
            buildd1-save/CMakeFiles/CMakeConfigureLog.yaml
            buildd1-save/CMakeCache.txt
            buildd2-save/CMakeFiles/CMakeConfigureLog.yaml
            buildd2-save/CMakeCache.txt
          retention-days: 3
          if-no-files-found: ignore
