name: XL asset smoke
run-name: XL qualification for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  # Manual dispatch exercises the public engine build on the selected revision.
  workflow_dispatch:
  workflow_run:
    workflows: [XL asset smoke request]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: xl-assets-controller-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  XL_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  admit:
    name: Verify owned PR and pin exact head
    if: github.repository == 'larsonm-personal/dxx-redux' && github.event.workflow_run.actor.id == 265118235 && github.event.workflow_run.head_repository.id == github.event.repository.id && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      eligible: ${{ steps.admit.outputs.eligible }}
      full_survey: ${{ steps.admit.outputs.full_survey }}
      sha: ${{ steps.admit.outputs.sha }}
      number: ${{ steps.admit.outputs.number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/android/tests/nightly_pr_candidate.py admit

  smoke:
    name: Original XL asset load and navigation
    needs: admit
    if: needs.admit.outputs.eligible == 'true'
    # The reusable workflow declares a ledger publisher; it is disabled for workflow_run
    # Executing plan/host jobs explicitly reduce this ceiling to contents: read
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/nightly-tooling-sweep.yml
    # Environment secrets still require a named forwarding contract
    secrets:
      RETAIL_ASSETS_READ_TOKEN: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
    with:
      campaign: xl-fast
      candidate_pr: ${{ needs.admit.outputs.number }}
      candidate_sha: ${{ needs.admit.outputs.sha }}
      source_run_id: ${{ format('{0}', github.event.workflow_run.id) }}

  report:
    name: Publish exact-head XL asset result
    needs: [admit, smoke]
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: nightly-results-host
          path: receipt
      - name: Require positive load and navigation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
          CANDIDATE_PR: ${{ needs.admit.outputs.number }}
          XL_QUALIFICATION_RESULT: ${{ needs.smoke.result }}
        run: python3 control/android/tests/nightly_pr_candidate.py report --receipt receipt/results.json

  readiness-runtime:
    name: Prepare signed Ubuntu runtime packages without game assets
    needs: admit
    if: always() && (needs.admit.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
      sha256: ${{ steps.identity.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Download runtime and dependencies from the signed Noble archives
        run: bash control/.github/scripts/install_xl_survey_runtime.sh prepare runtime.tar
      - name: Identify the prepared runtime
        id: identity
        run: |
          echo "artifact=xl-survey-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum runtime.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: runtime.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  readiness-engine:
    name: Build ordinary D2 readiness engine without private inputs
    needs: admit
    if: always() && (needs.admit.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ needs.admit.outputs.sha || github.sha }}
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
      sha256: ${{ steps.identity.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: target
          persist-credentials: false
      - name: Verify exact source checkout
        run: test "$(git -C target rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install native prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libphysfs-dev libsdl1.2-dev libsdl-mixer1.2-dev libpng-dev libglew-dev zlib1g-dev p7zip-full
          mkdir -p "$RUNNER_TEMP/dxx-readiness-deps"
          printf '%s\n' "$RUNNER_TEMP/dxx-readiness-deps" > target/dependency_base.txt
      - name: Build candidate load/tick executable without checkout credentials
        run: |
          cmake -S target/d2 -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DDXX_XL_DEVELOPER_TESTS=OFF
          cmake --build build --parallel 2 --target dxx-redux-d2-headless-route
      - name: Identify the executable for both readiness jobs
        id: identity
        run: |
          engine=build/main/dxx-redux-d2-headless-route
          test -x "$engine"
          echo "artifact=xl-readiness-engine-$CANDIDATE_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$engine" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: build/main/dxx-redux-d2-headless-route
          if-no-files-found: error
          retention-days: 1

  runtime-smoke:
    name: Start the ordinary engine with survey runtime packages
    if: always() && github.event_name == 'workflow_dispatch' && needs.readiness-engine.result == 'success' && needs.readiness-runtime.result == 'success'
    needs: [readiness-engine, readiness-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Install the verified survey runtime
        uses: ./control/.github/actions/xl-survey-runtime
        with:
          artifact: ${{ needs.readiness-runtime.outputs.artifact }}
          sha256: ${{ needs.readiness-runtime.outputs.sha256 }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.readiness-engine.outputs.artifact }}
          path: engine
      - name: Verify executable identity and start the native argument parser
        env:
          EXPECTED_SHA256: ${{ needs.readiness-engine.outputs.sha256 }}
        run: |
          binary=engine/dxx-redux-d2-headless-route
          printf '%s  %s\n' "$EXPECTED_SHA256" "$binary" | sha256sum --check --strict
          chmod u+x "$binary"
          status=0
          "$binary" > usage.txt 2>&1 || status=$?
          test "$status" = 1
          grep -F -- '-route-confirm-json-out <path>' usage.txt

  readiness:
    name: Measure D2X readiness on fixed uploaded sample
    needs: [admit, readiness-engine, readiness-runtime]
    if: needs.admit.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: retail-ci
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
      CANDIDATE_PR: ${{ needs.admit.outputs.number }}
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Revalidate pinned candidate before asset access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"control/android/tests"); import nightly_pr_candidate as c; c.verify(os.environ["CANDIDATE_SHA"])'
      - name: Install the verified survey runtime
        uses: ./control/.github/actions/xl-survey-runtime
        with:
          artifact: ${{ needs.readiness-runtime.outputs.artifact }}
          sha256: ${{ needs.readiness-runtime.outputs.sha256 }}
      - name: Check out pinned uploaded inventory and retail inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: larsonm-personal/dxx-redux-test-assets
          ref: 9dad21bd65ba05665ac6fe315f37fe7461e85725
          path: retail-input
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /descent_1.4a_retail/DESCENT.HOG
            /descent_1.4a_retail/DESCENT.PIG
            /descent_2_1.1_retail/ALIEN1.PIG
            /descent_2_1.1_retail/ALIEN2.PIG
            /descent_2_1.1_retail/DESCENT2.HAM
            /descent_2_1.1_retail/DESCENT2.HOG
            /descent_2_1.1_retail/DESCENT2.S22
            /descent_2_1.1_retail/FIRE.PIG
            /descent_2_1.1_retail/GROUPA.PIG
            /descent_2_1.1_retail/ICE.PIG
            /descent_2_1.1_retail/WATER.PIG
            /missions/d2xxl_downloads/BoilingPoint-XL.zip
            /missions/d2xxl_downloads/diehard.7z
            /missions/d2xxl_downloads/dinter-1.5.7z
            /missions/d2xxl_downloads/ironstar.7z
            /missions/d2xxl_downloads/orionneb.7z
            /missions/d2xxl_downloads/phobos-e.7z
            /missions/d2xxl_downloads/sphere-1.6.zip
            /missions/d2xxl_downloads/wshock20.7z
          token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          persist-credentials: false
      - name: Check out pinned authentic Vertigo and XL runtime resources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: larsonm-personal/dxx-redux-test-assets
          ref: dc6565f6b5400d7c700fa8378e766b2354b6ceb6
          path: readiness-resources
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /descent_2_vertigo/d2x.hog
            /xl-resources/d2x-xl.hog
          token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          persist-credentials: false
      - name: Stage hash-verified inputs with trusted tooling
        run: |
          python3 control/android/helpers/retail_ci_assets.py --root retail-input --repo control --source-map control/android/tests/retail_asset_sources.json --output retail-verification.json --stage retail-data
          python3 control/android/tests/xl_readiness.py prepare --assets retail-input --catalog control/android/tests/xl_readiness_inventory.json --work survey-input --data retail-data --resources readiness-resources
          rm -rf retail-input
          rm -rf readiness-resources
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.readiness-engine.outputs.artifact }}
          path: engine
      - name: Verify the admitted engine before measurement
        env:
          EXPECTED_SHA256: ${{ needs.readiness-engine.outputs.sha256 }}
        run: |
          test -n "$EXPECTED_SHA256"
          printf '%s  %s\n' "$EXPECTED_SHA256" engine/dxx-redux-d2-headless-route | sha256sum --check --strict
          chmod u+x engine/dxx-redux-d2-headless-route
      - name: Measure every frozen case without rerolling failures
        run: |
          python3 control/android/tests/xl_readiness.py run --engine engine/dxx-redux-d2-headless-route --assets survey-input --data survey-input/runtime --catalog control/android/tests/xl_readiness_inventory.json --work readiness --seven-zip /usr/bin/7z --target-sha "$CANDIDATE_SHA" --require-resources
      - name: Publish bounded measurement only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xl-readiness
          path: readiness/results.json
          retention-days: 14
          if-no-files-found: warn

  readiness-report:
    name: D2X readiness percentage (sampled load/tick)
    needs: [admit, readiness]
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: xl-readiness
          path: receipt
      - name: Publish honest readiness including unsuccessful cases
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
          CANDIDATE_PR: ${{ needs.admit.outputs.number }}
          READINESS_RESULT: ${{ needs.readiness.result }}
        run: python3 control/android/tests/xl_readiness_report.py --receipt receipt/results.json --catalog control/android/tests/xl_readiness_inventory.json --expected-failures control/android/tests/xl_readiness_expected.json --require-resources

  readiness-expanded:
    name: Measure expanded 64-case D2X readiness
    needs: [admit, readiness-engine, readiness-runtime]
    if: needs.admit.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: retail-ci
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
      CANDIDATE_PR: ${{ needs.admit.outputs.number }}
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Start ten-minute job clock
        run: echo "READINESS_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Revalidate pinned candidate before asset access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"control/android/tests"); import nightly_pr_candidate as c; c.verify(os.environ["CANDIDATE_SHA"])'
      - name: Install the verified survey runtime
        uses: ./control/.github/actions/xl-survey-runtime
        with:
          artifact: ${{ needs.readiness-runtime.outputs.artifact }}
          sha256: ${{ needs.readiness-runtime.outputs.sha256 }}
      - name: Stage verified survey inputs and the admitted engine
        uses: ./control/.github/actions/xl-survey-inputs
        with:
          retail-token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          engine-artifact: ${{ needs.readiness-engine.outputs.artifact }}
          engine-sha256: ${{ needs.readiness-engine.outputs.sha256 }}
      - name: Measure all 64 frozen cases within the probe budget
        run: |
          budget=$((580 - $(date +%s) + READINESS_STARTED))
          if (( budget > 360 )); then budget=360; fi
          if (( budget < 1 )); then budget=1; fi
          python3 control/android/tests/xl_readiness_expanded.py run --engine engine/dxx-redux-d2-headless-route --assets survey-input --data survey-input/runtime --catalog control/android/tests/xl_readiness_inventory.json --work readiness --seven-zip /usr/bin/7z --target-sha "$CANDIDATE_SHA" --budget-seconds "$budget"
      - name: Publish bounded measurement only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xl-readiness-expanded
          path: readiness/results.json
          retention-days: 14
          if-no-files-found: warn

  readiness-expanded-report:
    name: Expanded D2X measurement and distinct compatibility status
    needs: [admit, readiness-expanded]
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: xl-readiness-expanded
          path: receipt
      - name: Publish honest readiness including unsuccessful cases
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
          CANDIDATE_PR: ${{ needs.admit.outputs.number }}
          READINESS_RESULT: ${{ needs.readiness-expanded.result }}
        run: python3 control/android/tests/xl_readiness_expanded.py report --receipt receipt/results.json --target-sha "$CANDIDATE_SHA" --publish-status

  readiness-full:
    name: Measure all pinned D2X levels on request
    needs: [admit, readiness-engine, readiness-runtime]
    if: needs.admit.outputs.eligible == 'true' && needs.admit.outputs.full_survey == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: retail-ci
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
      CANDIDATE_PR: ${{ needs.admit.outputs.number }}
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Revalidate pinned candidate before asset access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"control/android/tests"); import nightly_pr_candidate as c; c.verify(os.environ["CANDIDATE_SHA"])'
      - name: Install the verified survey runtime
        uses: ./control/.github/actions/xl-survey-runtime
        with:
          artifact: ${{ needs.readiness-runtime.outputs.artifact }}
          sha256: ${{ needs.readiness-runtime.outputs.sha256 }}
      - name: Stage verified survey inputs and the admitted engine
        uses: ./control/.github/actions/xl-survey-inputs
        with:
          retail-token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          engine-artifact: ${{ needs.readiness-engine.outputs.artifact }}
          engine-sha256: ${{ needs.readiness-engine.outputs.sha256 }}
      - name: Measure the entire pinned inventory
        id: survey
        continue-on-error: true
        run: |
          python3 control/android/tests/xl_readiness_full.py --engine engine/dxx-redux-d2-headless-route --assets survey-input --data survey-input/runtime --catalog control/android/tests/xl_readiness_inventory.json --work readiness-full --seven-zip /usr/bin/7z --target-sha "$CANDIDATE_SHA"
      - name: Verify every case and prepare the public failure list
        env:
          EXPECTED_ENGINE: ${{ needs.readiness-engine.outputs.sha256 }}
        run: |
          python3 control/android/tests/xl_readiness_full_report.py --work readiness-full --catalog control/android/tests/xl_readiness_inventory.json --output survey-groups.json --require-full-inventory --expected-target "$CANDIDATE_SHA" --expected-engine "$EXPECTED_ENGINE"
      - name: Publish the reconciled case list
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xl-full-readiness-groups
          path: survey-groups.json
          if-no-files-found: error
          retention-days: 14
      - name: Report the measured readiness outcome
        env:
          SURVEY_RESULT: ${{ steps.survey.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('survey-groups.json').read_text())
          summary = report['summary']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              print(f"Full pinned readiness **{summary['passed']}/{summary['denominator']}**", file=stream)
              for family, count in sorted(report['groups'].items(), key=lambda item: -item[1]):
                  print(f"- {family} ({count})", file=stream)
          if os.environ['SURVEY_RESULT'] != 'success' or not summary['complete'] or report['failures']:
              raise SystemExit('The full pinned inventory has outstanding cases')
          PY
