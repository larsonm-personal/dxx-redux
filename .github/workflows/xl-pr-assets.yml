name: XL asset smoke
run-name: XL asset smoke for PR head ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [XL asset smoke request]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: xl-assets-controller-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  XL_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  admit:
    name: Verify owned PR and pin exact head
    if: github.repository == 'larsonm-personal/dxx-redux' && github.event.workflow_run.actor.id == 265118235 && github.event.workflow_run.head_repository.id == github.event.repository.id && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.admit.outputs.sha }}
      number: ${{ steps.admit.outputs.number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/android/tests/nightly_pr_candidate.py admit

  smoke:
    name: Original XL asset load and navigation
    needs: admit
    # The reusable workflow declares a ledger publisher; it is disabled for workflow_run
    # Executing plan/host jobs explicitly reduce this ceiling to contents: read
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/nightly-tooling-sweep.yml
    # Environment secrets still require a named forwarding contract
    secrets:
      RETAIL_ASSETS_READ_TOKEN: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
    with:
      campaign: xl-fast
      candidate_pr: ${{ needs.admit.outputs.number }}
      candidate_sha: ${{ needs.admit.outputs.sha }}
      source_run_id: ${{ format('{0}', github.event.workflow_run.id) }}

  report:
    name: Publish exact-head XL asset result
    needs: [admit, smoke]
    if: always() && needs.admit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: nightly-results-host
          path: receipt
      - name: Require positive load and navigation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
          CANDIDATE_PR: ${{ needs.admit.outputs.number }}
          XL_QUALIFICATION_RESULT: ${{ needs.smoke.result }}
        run: python3 control/android/tests/nightly_pr_candidate.py report --receipt receipt/results.json

  readiness:
    name: Measure D2X readiness on fixed uploaded sample
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: retail-ci
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
      CANDIDATE_PR: ${{ needs.admit.outputs.number }}
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Revalidate pinned candidate before asset access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"control/android/tests"); import nightly_pr_candidate as c; c.verify(os.environ["CANDIDATE_SHA"])'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.admit.outputs.sha }}
          path: target
          persist-credentials: false
      - name: Check out pinned uploaded inventory and retail inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: larsonm-personal/dxx-redux-test-assets
          ref: 9dad21bd65ba05665ac6fe315f37fe7461e85725
          path: retail-input
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /descent_1.4a_retail/DESCENT.HOG
            /descent_1.4a_retail/DESCENT.PIG
            /descent_2_1.1_retail/ALIEN1.PIG
            /descent_2_1.1_retail/ALIEN2.PIG
            /descent_2_1.1_retail/DESCENT2.HAM
            /descent_2_1.1_retail/DESCENT2.HOG
            /descent_2_1.1_retail/DESCENT2.S22
            /descent_2_1.1_retail/FIRE.PIG
            /descent_2_1.1_retail/GROUPA.PIG
            /descent_2_1.1_retail/ICE.PIG
            /descent_2_1.1_retail/WATER.PIG
            /missions/d2xxl_downloads/BoilingPoint-XL.zip
            /missions/d2xxl_downloads/diehard.7z
            /missions/d2xxl_downloads/dinter-1.5.7z
            /missions/d2xxl_downloads/ironstar.7z
            /missions/d2xxl_downloads/orionneb.7z
            /missions/d2xxl_downloads/phobos-e.7z
            /missions/d2xxl_downloads/sphere-1.6.zip
            /missions/d2xxl_downloads/wshock20.7z
          token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          persist-credentials: false
      - name: Stage hash-verified inputs with trusted tooling
        run: |
          python3 control/android/helpers/retail_ci_assets.py --root retail-input --repo control --source-map control/android/tests/retail_asset_sources.json --output retail-verification.json --stage retail-data
          python3 control/android/tests/xl_readiness.py prepare --assets retail-input --catalog control/android/tests/xl_readiness_inventory.json --work survey-input --data retail-data
          rm -rf retail-input
      - name: Install native prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libphysfs-dev libsdl1.2-dev libsdl-mixer1.2-dev libpng-dev libglew-dev zlib1g-dev p7zip-full
          mkdir -p "$RUNNER_TEMP/dxx-readiness-deps"
          printf '%s\n' "$RUNNER_TEMP/dxx-readiness-deps" > target/dependency_base.txt
      - name: Build candidate load/tick executable without checkout credentials
        run: |
          cmake -S target/d2 -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --parallel 2 --target dxx-redux-d2-headless-route
      - name: Measure every frozen case without rerolling failures
        run: |
          python3 control/android/tests/xl_readiness.py run --engine build/main/dxx-redux-d2-headless-route --assets survey-input --data survey-input/runtime --catalog control/android/tests/xl_readiness_inventory.json --work readiness --seven-zip /usr/bin/7z --target-sha "$CANDIDATE_SHA"
      - name: Publish bounded measurement only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xl-readiness
          path: readiness/results.json
          retention-days: 14
          if-no-files-found: warn

  readiness-report:
    name: D2X readiness percentage (sampled load/tick)
    needs: [admit, readiness]
    if: always() && needs.admit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: xl-readiness
          path: receipt
      - name: Publish honest readiness including unsuccessful cases
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
          CANDIDATE_PR: ${{ needs.admit.outputs.number }}
        run: python3 control/android/tests/xl_readiness_report.py --receipt receipt/results.json --catalog control/android/tests/xl_readiness_inventory.json
