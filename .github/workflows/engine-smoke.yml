name: Engine smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Linux ${{ matrix.game }} build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [d1, d2]
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native dependencies
        # A slow but progressing mirror can take 12 minutes for the 50 MB package set
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            build-essential cmake ninja-build libphysfs-dev libsdl1.2-dev \
            libsdl-mixer1.2-dev libpng-dev libglew-dev zlib1g-dev \
            xvfb xauth libgl1-mesa-dri

      - name: Check the Linux build and test runner
        timeout-minutes: 1
        run: |
          python3 android/tests/test_input_demo_assets.py
          python3 android/tests/test_linux_build_cli.py
          python3 android/tests/test_verified_dependency_download.py
          python3 android/tests/test_d1_briefing_automation.py
          python3 android/tests/test_save_epoch_contract.py
          python3 android/tests/test_android_audio_lifecycle.py

      # Debug keeps assertions active; tests run serially with a 120-second timeout
      - name: Build all native targets and run asset-free tests
        timeout-minutes: 17
        run: ./run-linux-build.sh --test --target "${{ matrix.game }}" --jobs 4 --generator Ninja

      - name: Prepare pinned public shareware data
        timeout-minutes: 5
        shell: pwsh
        run: |
          $fixtures = if ('${{ matrix.game }}' -eq 'd2') { 'both' } else { 'd1' }
          ./android/helpers/setup_shareware_test_data.ps1 -Game $fixtures -Download

      - name: Exercise real shareware replay and metadata
        timeout-minutes: 3
        env:
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          game="${{ matrix.game }}"
          xvfb-run -a pwsh -NoProfile -File android/tests/test_input_demo_runtime_smoke.ps1 \
            -Game "$game" -DataEdition shareware \
            -"${game^^}Exe" "$PWD/build${game}-test/main/${game}x-redux"
          pwsh -NoProfile -File android/tests/test_secret_area_baseline.ps1 \
            -Game "$game" -DataEdition shareware -RequireAssets \
            -"${game^^}Exe" "$PWD/build${game}-test/main/dxx-redux-${game}-headless-metadata"

      - name: Replay every verified shareware recording
        timeout-minutes: 5
        run: |
          game="${{ matrix.game }}"
          pwsh -NoProfile -File android/tests/run_input_demo_regressions.ps1 \
            -SharewareOnly -Game "$game" -RunMode headless -StopOnFirstFailure \
            -ExecutablePath "$PWD/build${game}-test/main/dxx-redux-${game}-headless" \
            -ResultArchiveRoot "$PWD/temp/verified-shareware-${game}"

      - name: Check public metadata worker failure recovery
        timeout-minutes: 3
        run: |
          game="${{ matrix.game }}"
          worker="$PWD/build${game}-test/main/dxx-redux-${game}-metadata-worker"
          pwsh -NoProfile -File android/tests/test_native_metadata_worker.ps1 \
            -Game "$game" -DataEdition shareware -Executable "$worker"
          pwsh -NoProfile -File android/tests/test_metadata_level_headers.ps1 \
            -NoBuild -Game "$game" -DataEdition shareware -"${game^^}Exe" "$worker"
          if [ "$game" = d2 ]; then
            pwsh -NoProfile -File android/tests/test_native_metadata_worker.ps1 \
              -Game d2 -ContentGame d1 -CheckProfileSwitch -DataEdition shareware -Executable "$worker"
          fi

      - name: Keep test and configure diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: engine-smoke-${{ matrix.game }}
          path: |
            build${{ matrix.game }}-test/ctest-results.xml
            build${{ matrix.game }}-test/Testing/Temporary/
            build${{ matrix.game }}-test/CMakeFiles/CMakeConfigureLog.yaml
            build${{ matrix.game }}-test/CMakeCache.txt
            temp/input_demo_runtime_smoke/shareware/
            temp/verified-shareware-*/
            android/temp/secret_area_shareware_baseline/
            temp/native-metadata-worker-*/
            android/temp/metadata-level-header-test/
          retention-days: 3
          if-no-files-found: ignore

  public-sanitizers:
    name: Linux public ASan runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install native dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            build-essential cmake ninja-build libphysfs-dev libsdl1.2-dev \
            libsdl-mixer1.2-dev libpng-dev libglew-dev zlib1g-dev \
            xvfb xauth libgl1-mesa-dri
      - name: Check public profile orchestration
        run: python3 android/tests/test_public_sanitizer_runner.py
      - name: Prepare pinned public fixtures
        shell: pwsh
        run: ./android/helpers/setup_shareware_test_data.ps1 -Game both -Download
      - name: Run instrumented public workloads
        run: |
          xvfb-run -a pwsh -NoProfile -File android/tests/run_engine_sanitizers.ps1 \
            -Category Public -MaxParallel 2 -OutputRoot "$PWD/android/temp/public-sanitizers-ci"
      - name: Keep sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-sanitizer-diagnostics
          path: |
            android/temp/public-sanitizers-ci/
            buildd1-asan/Testing/Temporary/
            buildd2-asan/Testing/Temporary/
            buildd1-asan/CMakeCache.txt
            buildd2-asan/CMakeCache.txt
          retention-days: 3
          if-no-files-found: ignore
