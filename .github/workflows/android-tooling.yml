name: scripts and ci tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate all GitHub workflows
        shell: bash
        run: |
          lint_root="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir -p "$lint_root"
          curl --fail --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$lint_root/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $lint_root/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$lint_root/actionlint.tar.gz" -C "$lint_root" actionlint
          "$lint_root/actionlint"

  catalogs:
    name: Automation catalogs
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Resolve catalog dependency paths without installing tools
        shell: bash
        run: source android/get_deps/helpers/resolve_dep_base.sh
      - shell: pwsh
        run: |
          ./android/tests/test_validate_automation_catalog.ps1
          exit $LASTEXITCODE

  stack:
    uses: ./.github/workflows/stack-ci.yml
    with:
      profile: scripts

  scripts-and-ci-tests:
    name: scripts and ci tests (${{ matrix.os }})
    needs: stack
    if: needs.stack.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    # Windows' passing suites take nearly 15 minutes including PS 5.1 and cleanup
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 20 || 15 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Refresh scripts and CI eligibility
        id: current
        env:
          STACK_CI_PROFILE: scripts
        shell: bash
        run: python3 .github/scripts/stack_ci.py
      - name: Install verified bounded Python
        if: steps.current.outputs.run == 'true'
        shell: bash
        run: bash ./android/get_deps/helpers/get_bounded_python.sh
      - name: Nightly sweep planner and ledger controls
        if: steps.current.outputs.run == 'true'
        shell: bash
        run: |
          python3 android/tests/test_nightly_runner_storage.py
          python3 android/tests/test_nightly_tooling_sweep.py
          python3 android/tests/test_nightly_corpus_stage.py
          python3 android/tests/test_nightly_regression_catalog.py
          python3 android/tests/test_nightly_regression_corpus.py
          python3 android/tests/test_corpus_comparison.py
          python3 android/tests/test_nightly_retail.py
          python3 android/tests/test_xl_private_assets.py
          python3 android/tests/test_private_input_demos.py
          python3 android/tests/test_retail_ci_assets.py
          python3 android/tests/test_run_host_test_suites.py
      - name: Script and CI smoke tests
        if: steps.current.outputs.run == 'true'
        shell: pwsh
        run: ./android/tests/run_tooling_smoke.ps1 -IncludeBoundedRuntime
      - name: GitHub release tests on Windows PowerShell 5.1
        if: always() && steps.current.outputs.run == 'true' && runner.os == 'Windows'
        shell: powershell
        run: ./android/tests/test_github_release.ps1
      - name: Keep bounded diagnostic reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scripts-and-ci-tests-${{ matrix.os }}
          path: android/temp/tooling_smoke/**
          retention-days: 3
          if-no-files-found: ignore
