name: Android tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'run-linux-build.sh'
      - 'run-windows-build.ps1'
      - 'cmake/**'
      - '.github/workflows/android-tooling.yml'
  push:
    paths:
      - 'android/**'
      - 'run-linux-build.sh'
      - 'run-windows-build.ps1'
      - 'cmake/**'
      - '.github/workflows/android-tooling.yml'

permissions:
  contents: read

concurrency:
  group: android-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install verified bounded Python
        shell: bash
        run: bash ./android/get_deps/helpers/get_bounded_python.sh
      - name: Tooling smoke tests
        shell: pwsh
        run: ./android/tests/run_tooling_smoke.ps1 -IncludeBoundedRuntime
      - name: GitHub release tests on Windows PowerShell 5.1
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: ./android/tests/test_github_release.ps1
      - name: Keep bounded diagnostic reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tooling-${{ matrix.os }}
          path: android/temp/tooling_smoke/**
          retention-days: 3
          if-no-files-found: ignore
