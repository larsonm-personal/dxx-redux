name: Public LAN smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      campaign:
        description: Bounded public LAN coverage through the normal test entrypoint
        type: choice
        options: [lan-smoke, lan-three-player]
        default: lan-smoke
      evidence_run_id:
        description: Export compact public evidence from an existing run (no emulator execution)
        type: string
        default: ""
      recovery_cases:
        description: Optional comma-separated recovery cases (empty runs all)
        type: string
        default: ""
      recovery_checks:
        description: Run focused parallel startup recovery experiments
        type: boolean
        default: false
      measure_transitions:
        description: Repeat public LAN transition timing experiment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A labeled three-player run must not cancel the ordinary two-player PR check
  group: public-lan-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && (github.event.label.name == 'test-three-player-network' && 'lan-three-player' || 'ignored-label') || inputs.campaign || 'lan-smoke' }}-${{ inputs.evidence_run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select public LAN smoke
    if: ${{ !inputs.evidence_run_id && (github.event.action != 'labeled' || github.event.label.name == 'test-three-player-network') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      campaign: ${{ steps.select.outputs.campaign }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Check out exact target catalog
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          persist-credentials: false
      - name: Prepare host dependency location
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-nightly-deps" target/android/temp target/temp
          printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > target/dependency_base.txt
      - name: Export authoritative master catalog
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path plan -Force | Out-Null
          & ./target/android/run_all_tests.ps1 -ListTests -ExtendedGraphics | Set-Content plan/catalog.json -Encoding utf8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Select the bounded public LAN campaign
        id: select
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CAMPAIGN: ${{ github.event.action == 'labeled' && github.event.label.name == 'test-three-player-network' && 'lan-three-player' || inputs.campaign || 'lan-smoke' }}
        run: |
          echo "campaign=$CAMPAIGN" >> "$GITHUB_OUTPUT"
          python3 control/android/tests/nightly_tooling_sweep.py plan \
            --target-sha "$TARGET_SHA" --catalog plan/catalog.json \
            --policy control/android/tests/nightly_tooling_policy.json --campaign "$CAMPAIGN" \
            --output plan/plan.json --state-output plan/state.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-plan
          path: plan/
          retention-days: 30

  android:
    name: ${{ (github.event.action == 'labeled' || inputs.campaign == 'lan-three-player') && 'Three-player startup and selected-player loss' || 'Two-player lobby to game' }}
    needs: plan
    uses: ./.github/workflows/android-nightly-tooling.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      plan_artifact: nightly-plan
      lane: android-dual
      retail_assets: false
      measure_transitions: ${{ needs.plan.outputs.campaign != 'lan-three-player' && inputs.measure_transitions == true }}
      recovery_checks: ${{ needs.plan.outputs.campaign != 'lan-three-player' && inputs.recovery_checks == true }}
      recovery_cases: ${{ inputs.recovery_cases }}

  finish:
    name: ${{ (github.event.action == 'labeled' || inputs.campaign == 'lan-three-player') && 'Require three-player LAN pass' || 'Require public LAN pass' }}
    needs: [plan, android]
    if: ${{ always() && !inputs.evidence_run_id && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-plan
          path: plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: nightly-results-*
          path: receipts
      - name: Reconcile terminal results and retain unresolved failures
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAN_RESULT: ${{ needs.plan.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          CAMPAIGN: ${{ needs.plan.outputs.campaign }}
        run: |
          status=0
          [[ "$PLAN_RESULT" == success && "$ANDROID_RESULT" == success ]] || status=$?
          # A setup-only, missing, or unexpectedly empty selection cannot pass
          python3 - <<'PYTHON' || status=$?
          import json, os
          p = json.load(open('plan/plan.json'))
          expected = {'lan-smoke': ['master:test_lan_launch_preparation_public_shareware'],
                      'lan-three-player': ['master:test_lan_three_player_startup']}
          assert [e['id'] for e in p['tests']] == expected[os.environ['CAMPAIGN']]
          assert p['lanes'] == ['android-dual']
          assert p['target_sha'] == os.environ['TARGET_SHA']
          PYTHON
          mapfile -t receipts < <(find receipts -mindepth 1 -maxdepth 2 -type f \( -path 'receipts/results.json' -o -path 'receipts/nightly-results-*/results.json' \) 2>/dev/null | sort)
          python3 control/android/tests/nightly_tooling_sweep.py reconcile \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --state plan/state.json --output summary-state.json --require-selected --receipts "${receipts[@]}" > summary.json || status=$?
          {
            echo "## Public LAN: $CAMPAIGN"
            echo 'Exact target, completed owners, unresolved failures, blocked suites and exclusions:'
            echo '```json'
            cat summary.json
            echo '```'
            echo 'The exact selected owner must pass; three-player coverage additionally requires all four named leaf results. Missing or skipped results fail this check.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: nightly-sweep-summary
          path: |
            summary.json
            summary-state.json
          retention-days: 30

  evidence:
    name: Export public timing evidence
    if: ${{ inputs.evidence_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-results-android-dual
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: evidence
      # GitHub caps annotation messages at 4096 characters and notices per step
      - name: Export bounded diagnostics through check annotations (1/5)
        run: python3 android/helpers/export_lan_evidence.py evidence 0
      - name: Export bounded diagnostics through check annotations (2/5)
        run: python3 android/helpers/export_lan_evidence.py evidence 1
      - name: Export bounded diagnostics through check annotations (3/5)
        run: python3 android/helpers/export_lan_evidence.py evidence 2
      - name: Export bounded diagnostics through check annotations (4/5)
        run: python3 android/helpers/export_lan_evidence.py evidence 3
      - name: Export bounded diagnostics through check annotations (5/5)
        run: python3 android/helpers/export_lan_evidence.py evidence 4
