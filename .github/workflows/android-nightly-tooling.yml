name: Android and JVM tests

on:
  workflow_call:
    inputs:
      target_sha:
        description: Immutable target commit selected by the trusted sweep planner
        required: true
        type: string
      plan_artifact:
        description: Same-run artifact containing plan.json
        required: true
        type: string
      recovery_cases:
        required: false
        type: string
        default: ""
      recovery_checks:
        required: false
        type: boolean
        default: false
      measure_transitions:
        required: false
        type: boolean
        default: false
      retail_assets:
        required: false
        type: boolean
        default: false
      retail_commit:
        required: false
        type: string
        default: ""
      lane:
        description: jvm, android-single, or android-dual (two or three devices as selected)
        required: true
        type: string
    secrets:
      RETAIL_ASSETS_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  android:
    name: Run selected tests
    runs-on: ubuntu-24.04
    # Provision/build time is separate from the approximately 45-minute test sample
    timeout-minutes: 105
    environment: ${{ inputs.retail_assets && github.repository == 'larsonm-personal/dxx-redux' && github.ref == 'refs/heads/cmake' && github.workflow_ref == 'larsonm-personal/dxx-redux/.github/workflows/nightly-tooling-sweep.yml@refs/heads/cmake' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'retail-ci' || 'asset-free' }}
    env:
      RETAIL_ASSETS_COMMIT: ${{ vars.RETAIL_ASSETS_COMMIT }}
      RETAIL_CHECKOUT_COMMIT: ${{ inputs.retail_commit }}
      TARGET_SHA: ${{ inputs.target_sha }}
      SWEEP_LANE: ${{ inputs.lane }}
      DXX_RECOVERY_CASES: ${{ inputs.recovery_cases }}
      DXX_RECOVERY_CHECKS: ${{ inputs.recovery_checks }}
      DXX_MEASURE_TRANSITIONS: ${{ inputs.measure_transitions }}
      RETAIL_REQUESTED: ${{ inputs.retail_assets }}
      ORG_GRADLE_PROJECT_ciTestAbi: x86_64
      ORG_GRADLE_PROJECT_compareProxyHistory: "true"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      GET_ALL_RUNNING: "1"
    steps:
      - name: Check lane arguments
        shell: bash
        run: |
          if [[ "$RETAIL_REQUESTED" == true ]]; then
            [[ "$GITHUB_REPOSITORY" == larsonm-personal/dxx-redux &&
               "$GITHUB_REF" == refs/heads/cmake &&
               "$GITHUB_WORKFLOW_REF" == larsonm-personal/dxx-redux/.github/workflows/nightly-tooling-sweep.yml@refs/heads/cmake &&
               ( "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]] || exit 1
          fi
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          case "$SWEEP_LANE" in jvm|android-single|android-dual) ;; *) exit 1 ;; esac
      - name: Check out trusted sweep controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Check out exact test target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.target_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Download selected tests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.plan_artifact }}
          path: plan
      - name: Inspect fixed fixture requirement
        id: selection
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          sys.path.insert(0, 'control/android/tests')
          from nightly_tooling_sweep import validate_plan
          plan = json.load(open('plan/plan.json'))
          validate_plan(plan, json.load(open('control/android/tests/nightly_tooling_policy.json')))
          if plan['target_sha'] != os.environ['TARGET_SHA']:
              raise ValueError('Selected plan differs from exact target')
          selected = [test for test in plan['tests'] if test.get('lane') == os.environ['SWEEP_LANE']]
          requirements = {
              'public_fixtures': any(test.get('owner') == 'shareware' or test.get('args', {}).get('suite') in ('test_demo_import_public_basic_use', 'test_demo_import_public_first_play', 'test_lan_launch_preparation_public_shareware', 'test_lan_host_migration_public_shareware', 'test_lan_three_player_startup', 'test_mp_public_shareware', 'test_mp_public_shareware_d2') for test in selected),
              'online_preview': any(test.get('args', {}).get('suite') in ('test_mp_public_shareware', 'test_mp_public_shareware_d2') for test in selected),
              'three_emulators': any(test.get('requires') == 'three_emulators' for test in selected),
              'generated_audio': any(test.get('owner') == 'master' and test.get('args', {}).get('suite') == 'test_launcher_media_controls_generated' for test in selected),
              'native_replay': any(test.get('owner') == 'shareware' and test.get('args', {}).get('suite') in ('test_auto_level_cheats', 'test_auto_level_demos') for test in selected),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, needed in requirements.items():
                  output.write(f"{name}={str(needed).lower()}\n")
          PYTHON
      - name: Prepare pinned local matchmaking server
        if: steps.selection.outputs.online_preview == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '$1 == "rustc" {print $2}' target/server/rust_version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          cargo +"$version" build --locked --release --manifest-path target/server/Cargo.toml
      - name: Rehearse owned TLS listener lifecycle
        if: steps.selection.outputs.online_preview == 'true'
        shell: bash
        run: |
          python3 target/server/test_loopback_fault_proxy.py
          python3 target/server/rehearse_preview.py \
            --binary "$GITHUB_WORKSPACE/target/server/target/release/dxx-matchmaking"
      - name: Prepare dependency locations
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_SHA" ]]
          mkdir -p results/setup "$RUNNER_TEMP/dxx-nightly-deps"
          source target/android/get_deps/tool_versions.conf
          dep_base="$RUNNER_TEMP/dxx-nightly-deps"
          # Managed SDK writers require a real directory, not a hosted-SDK symlink.
          sdk_root="$dep_base/android-sdk"
          mkdir -p "$sdk_root"
          printf '%s\n' "$dep_base" > target/dependency_base.txt
          {
            echo "DXX_LANE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "DXX_NIGHTLY_DEPS=$dep_base"
            echo "JAVA_HOME=$dep_base/jdk-$JDK_MAJOR"
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_ROOT=$dep_base/android-ndk-$NDK_VERSION"
            echo "DXX_NIGHTLY_SDK_CACHE=$sdk_root"
            echo "DXX_NIGHTLY_COMPILE_SDK=$COMPILE_SDK"
            echo "DXX_NIGHTLY_BUILD_TOOLS=$BUILD_TOOLS_VERSION"
            echo "DXX_NIGHTLY_CMAKE=$CMAKE_VERSION"
            echo "DXX_NIGHTLY_EMULATOR_API=$EMULATOR_API_LEVEL"
          } >> "$GITHUB_ENV"
          {
            echo "$dep_base/jdk-$JDK_MAJOR/bin"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/emulator"
          } >> "$GITHUB_PATH"
          df -h . | tee results/setup/storage-before.log
      - name: Require accelerated emulator access
        if: inputs.lane != 'jvm'
        shell: bash
        run: |
          set -euo pipefail
          {
            id
            if [[ -e /dev/kvm ]]; then
              stat -c 'KVM type=%F mode=%a owner=%U(%u) group=%G(%g)' /dev/kvm
              if command -v getfacl >/dev/null; then getfacl -p /dev/kvm; fi
            else
              echo 'KVM device is absent'
            fi
          } 2>&1 | tee results/setup/kvm-access.log
          if [[ ! -c /dev/kvm ]]; then
            echo 'BLOCKED: KVM character device is absent' | tee results/setup/kvm.log
            exit 1
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            # Approved ephemeral access for this existing runner user only.
            command -v getfacl
            command -v setfacl
            getfacl -p -n /dev/kvm > "$RUNNER_TEMP/dxx-kvm-before.acl"
            # A new shared mask must not unmask another named user's/group's rights.
            if grep -Eq '^(mask::|user:[^:]+:|group:[^:]+:)' "$RUNNER_TEMP/dxx-kvm-before.acl"; then
              echo 'BLOCKED: existing extended KVM ACL requires separate review' | tee results/setup/kvm.log
              exit 1
            fi
            printf '%s\n' "$(id -u)" > "$RUNNER_TEMP/dxx-kvm-runner.uid"
            touch "$RUNNER_TEMP/dxx-kvm-acl-changed"
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          fi
          [[ -r /dev/kvm && -w /dev/kvm ]]
          getfacl -p -n /dev/kvm | tee results/setup/kvm-effective.acl
      - name: Restore pinned toolchain components
        id: tools
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/dxx-nightly-deps/jdk-21
            ${{ runner.temp }}/dxx-nightly-deps/android-ndk-*
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/platforms/android-${{ env.DXX_NIGHTLY_COMPILE_SDK }}*
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/build-tools/${{ env.DXX_NIGHTLY_BUILD_TOOLS }}
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/cmake/${{ env.DXX_NIGHTLY_CMAKE }}
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/cmdline-tools/latest
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/platform-tools
          key: nightly-android-tools-v2-${{ runner.os }}-${{ hashFiles('target/android/get_deps/tool_versions.conf') }}
      - name: Restore Gradle and native dependencies
        id: dependencies
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            target/android/.cxx/dependency-cache
          key: nightly-android-deps-${{ runner.os }}-${{ hashFiles('target/android/get_deps/tool_versions.conf', 'target/android/**/*.gradle') }}
      - name: Provision pinned build tools
        id: setup
        timeout-minutes: 35
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          {
            bash android/get_deps/helpers/get_jdk.sh
            bash android/get_deps/helpers/get_sdk.sh
            bash android/get_deps/helpers/finalize.sh
            bash android/get_deps/helpers/get_ndk.sh
            bash android/get_deps/helpers/get_gradle_wrapper.sh
            bash android/get_deps/check_build_prereqs.sh
            java -version
            javac -version
            df -h .
          } 2>&1 | tee ../results/setup/toolchain.log
      - name: Restore emulator components
        if: inputs.lane != 'jvm'
        id: emulator-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/emulator
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/system-images/android-${{ env.DXX_NIGHTLY_EMULATOR_API }}/google_apis/x86_64
          key: nightly-android-emulator-${{ runner.os }}-${{ hashFiles('target/android/get_deps/tool_versions.conf') }}
      - name: Provision emulator host runtime
        if: inputs.lane != 'jvm'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libpulse0
          } 2>&1 | tee results/setup/emulator-host-runtime.log
      - name: Provision dual-lane master host prerequisites
        if: inputs.lane == 'android-dual'
        timeout-minutes: 15
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          bash android/get_deps/helpers/get_linux_build_prereqs.sh 2>&1 | tee ../results/setup/dual-host-prerequisites.log
      - name: Provision selected auto-level replay prerequisites
        if: steps.selection.outputs.native_replay == 'true'
        timeout-minutes: 15
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          {
            bash android/get_deps/helpers/get_linux_build_prereqs.sh
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
            command -v xvfb-run
          } 2>&1 | tee ../results/setup/native-replay-prerequisites.log
      - name: Build selected native replay executables before test budget
        if: steps.selection.outputs.native_replay == 'true'
        timeout-minutes: 20
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python3 - <<'PYTHON' > ../results/setup/native-replay-games.txt
          import json, os
          plan = json.load(open('../plan/plan.json'))
          games = set()
          for test in plan['tests']:
              if test.get('lane') != os.environ['SWEEP_LANE'] or test.get('owner') != 'shareware':
                  continue
              if test.get('args', {}).get('suite') not in ('test_auto_level_cheats', 'test_auto_level_demos'):
                  continue
              game = test['args']['game']
              if game not in ('d1', 'd2', 'd1-in-d2'):
                  raise ValueError('Unsupported native replay game')
              games.add('d1' if game == 'd1' else 'd2')
          if not games:
              raise ValueError('Native replay setup selected no games')
          print('\n'.join(sorted(games)))
          PYTHON
          while IFS= read -r game; do
            bash ./run-linux-build.sh --target "$game" --game-only --jobs 2
          done < ../results/setup/native-replay-games.txt 2>&1 | tee ../results/setup/native-replay-build.log
      - name: Provision emulator image
        if: inputs.lane != 'jvm'
        id: emulator
        timeout-minutes: 15
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          bash android/get_deps/helpers/get_emulator.sh 2>&1 | tee ../results/setup/emulator-image.log
      - name: Check emulator runtime before APK build
        if: inputs.lane != 'jvm'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          emulator -version 2>&1 | tee results/setup/emulator-version.log
      - name: Require shared Wi-Fi emulator generation
        if: inputs.lane == 'android-dual'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import pathlib, re
          text = pathlib.Path('results/setup/emulator-version.log').read_text()
          match = re.search(r'Android emulator version (\d+)\.(\d+)', text)
          if not match or tuple(map(int, match.groups())) < (36, 5):
              raise SystemExit('BLOCKED: dual LAN tests require emulator 36.5+ shared Wi-Fi; isolated NAT is unsupported')
          PYTHON
      - name: Qualify production installation identity with real service
        if: steps.selection.outputs.online_preview == 'true'
        shell: bash
        run: |
          bash target/android/gradlew -p target/android -PhostJvmOnly=true \
            -PonlineServerBinary="$GITHUB_WORKSPACE/target/server/target/release/dxx-matchmaking" \
            :proxy-tests:test --no-daemon --max-workers=2
      - name: Build emulator APKs before boot
        if: inputs.lane != 'jvm'
        id: apk
        timeout-minutes: 35
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          bash android/gradlew -p android assembleDebug assembleDebugAndroidTest \
            -PciApk=false -PgithubRelease=false -PlegacyRelease=false -PnsdDiagnosticApp=false \
            --console=plain --no-daemon --max-workers=2 2>&1 | tee ../results/setup/apk-build.log
      - name: Check out pre-admission compatibility peer
        if: inputs.recovery_checks && (inputs.recovery_cases == '' || contains(inputs.recovery_cases, 'mixed-binaries'))
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 01401425aff549eefd8b5a9e9fd8a8458d01a9b8
          path: compatibility-peer
          fetch-depth: 0
          persist-credentials: false
      - name: Build actual old peer binary
        if: inputs.recovery_checks && (inputs.recovery_cases == '' || contains(inputs.recovery_cases, 'mixed-binaries'))
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          cp target/dependency_base.txt compatibility-peer/dependency_base.txt
          if [[ -f target/android/local.properties ]]; then cp target/android/local.properties compatibility-peer/android/local.properties; fi
          bash compatibility-peer/android/get_deps/helpers/get_gradle_wrapper.sh
          bash compatibility-peer/android/gradlew -p compatibility-peer/android assembleDebug \
            -PciApk=false -PgithubRelease=false -PlegacyRelease=false -PnsdDiagnosticApp=false \
            --console=plain --no-daemon --max-workers=2 2>&1 | tee results/setup/compatibility-build.log
          old_apk=$(find compatibility-peer/android/app/build/outputs/apk/debug -name app-debug.apk -print -quit)
          test -n "$old_apk"
          sha256sum "$old_apk" | tee results/setup/compatibility-apk.sha256
          git -C compatibility-peer rev-parse HEAD > results/setup/compatibility-revision.txt
          echo "DXX_COMPAT_APK=$GITHUB_WORKSPACE/$old_apk" >> "$GITHUB_ENV"
      - name: Provision verified public fixtures
        if: steps.selection.outputs.public_fixtures == 'true'
        id: fixtures
        timeout-minutes: 15
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          # Existing verifier enforces pinned installer/file hashes and rejects retail shadows
          bash android/get_deps/helpers/get_bounded_python.sh 2>&1 | tee ../results/setup/bounded-python.log
          pwsh -NoProfile -NonInteractive -File android/helpers/setup_shareware_test_data.ps1 \
            -Game both -Download -RequireArchives 2>&1 | tee ../results/setup/public-fixtures.log
      - name: Require standard FFmpeg for generated preview fixture
        if: inputs.lane == 'android-single' && steps.selection.outputs.generated_audio == 'true'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          {
            # Official Ubuntu Noble package: https://packages.ubuntu.com/noble/ffmpeg
            expected='7:6.1.1-3ubuntu5'
            installed=$(dpkg-query -W -f='${Version}' ffmpeg 2>/dev/null || true)
            if [[ "$installed" != "$expected" ]]; then
              sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
              sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends "ffmpeg=$expected"
            fi
            [[ "$(dpkg-query -W -f='${Version}' ffmpeg)" == "$expected" ]]
            [[ "$(command -v ffmpeg)" == /usr/bin/ffmpeg ]]
            [[ "$(command -v ffprobe)" == /usr/bin/ffprobe ]]
            ffmpeg -version
            ffprobe -version
          } 2>&1 | tee results/setup/ffmpeg.log
      - name: Verify trusted retail checkout boundary
        id: retail_gate
        env:
          RETAIL_READ_TOKEN: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
        if: inputs.retail_assets
        run: |
          [[ -n "$RETAIL_READ_TOKEN" ]] || { echo "Retail read-only environment secret is missing" >&2; exit 1; }
          unset RETAIL_READ_TOKEN
          [[ "$RETAIL_CHECKOUT_COMMIT" == "$RETAIL_ASSETS_COMMIT" ]]
          python3 control/android/tests/nightly_tooling_sweep.py retail-check \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json --lane "$SWEEP_LANE"
      - name: Check out immutable private retail inputs
        id: retail_checkout
        if: inputs.retail_assets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: larsonm-personal/dxx-redux-test-assets
          ref: ${{ inputs.retail_commit }}
          token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          path: retail-input
          persist-credentials: false
      - name: Verify supplied edition and stage base retail files
        if: inputs.retail_assets
        id: retail_stage
        run: |
          [[ "$(git -C retail-input rev-parse HEAD)" == "$RETAIL_CHECKOUT_COMMIT" ]]
          python3 control/android/helpers/retail_ci_assets.py --root retail-input --repo control --source-map control/android/tests/retail_asset_sources.json \
            --output results/retail-verification.json --stage target/game_data/retail-ci --include-missions
          rm -rf retail-input
      - name: Prepare isolated headless emulators
        if: inputs.lane != 'jvm'
        timeout-minutes: 8
        shell: pwsh
        working-directory: target
        env:
          DXX_SELECTED_THREE_EMULATORS: ${{ steps.selection.outputs.three_emulators }}
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ../results/setup/emulator-boot.log
          try {
          . ./android/helpers/test_helpers.ps1
          $avds = @(@{ Name = 'Nexus5X_Light_1'; Serial = 'emulator-5554' })
          if ($env:SWEEP_LANE -eq 'android-dual') { $avds += @{ Name = 'Nexus5X_Light_2'; Serial = 'emulator-5556' } }
          $experimentalThird = $env:DXX_RECOVERY_CHECKS -eq 'true' -and (-not $env:DXX_RECOVERY_CASES -or $env:DXX_RECOVERY_CASES -match '(^|,)three-player(-lost)?(,|$)')
          if ('${{ steps.selection.outputs.online_preview }}' -eq 'true' -or $env:DXX_SELECTED_THREE_EMULATORS -eq 'true' -or $experimentalThird) {
            $avds += @{ Name = 'Nexus5X_Light_3'; Serial = 'emulator-5558' }
            'DXX_THIRD_EMULATOR_SERIAL=emulator-5558' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          foreach ($avd in $avds) {
            & ./android/get_deps/helpers/create_light_avds.ps1 -AvdName $avd.Name
            if ($LASTEXITCODE -ne 0) { throw 'AVD provisioning failed' }
            & bash "$env:GITHUB_WORKSPACE/control/android/helpers/refresh_nightly_kvm_access.sh"
            if ($LASTEXITCODE -ne 0) { throw 'Approved runner KVM access could not be refreshed safely' }
            Write-Host "Host KVM state before $($avd.Name)"
            & id
            & stat -c '%F %a %U:%G' /dev/kvm
            & getfacl -p -n /dev/kvm
            & python3 -c 'import os; fd = os.open("/dev/kvm", os.O_RDWR); os.close(fd); print("Direct KVM open succeeded")'
            if ($LASTEXITCODE -ne 0) { throw 'Direct KVM access failed before emulator acceleration probe' }
            & ./android/helpers/emu_health.ps1 -Restart -Wait -Headless -GpuRenderer swiftshader_indirect -AvdName $avd.Name -PreferredSerial $avd.Serial
            if ($LASTEXITCODE -notin @(0, 2)) { throw 'Accelerated emulator boot failed' }
            if (-not (Install-ApkOnDevice -Serial $avd.Serial)) { throw 'Debug APK install failed' }
            $instrumentation = Get-AndroidTestApkPath -Instrumentation
            if (-not $instrumentation) { throw 'Instrumentation APK missing' }
            $installed = Adb-Dev -Serial $avd.Serial -AdbArgs @('install', '-r', '-t', $instrumentation) -Seconds 180
            if ($installed -notmatch 'Success') { throw "Instrumentation APK install failed: $installed" }
          }
          if ($env:SWEEP_LANE -eq 'android-dual') {
            $addresses = @($avds | ForEach-Object { Get-DeviceWlanIp -Serial $_.Serial })
            Write-Host "Shared Wi-Fi addresses: $($addresses -join ', ')"
            if ($addresses.Count -ne $avds.Count -or @($addresses | Where-Object { $_ } | Sort-Object -Unique).Count -ne $avds.Count) {
              throw "LAN topology unavailable: $($avds.Count) distinct wlan0 addresses are required"
            }
          }
          } finally { Stop-Transcript }
          exit 0
      - name: Execute reviewed test selection
        id: execute
        timeout-minutes: 50
        shell: bash
        env:
          NATIVE_REPLAY: ${{ steps.selection.outputs.native_replay }}
        run: |
          set -euo pipefail
          if [[ "$SWEEP_LANE" != 'jvm' ]]; then
            bash control/android/helpers/refresh_nightly_kvm_access.sh
          fi
          command=(python3 control/android/tests/nightly_tooling_sweep.py execute
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json
            --lane "$SWEEP_LANE" --repo "$GITHUB_WORKSPACE/target" --output "$GITHUB_WORKSPACE/results")
          if [[ "$NATIVE_REPLAY" == true ]]; then
            # Auto-level owners record on Android, then replay in the native SDL/OpenGL executable
            command=(xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp'
              env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy "${command[@]}")
          fi
          "${command[@]}"
      - name: Reconcile durable test evidence
        if: always() && hashFiles('plan/plan.json') != '' && hashFiles('control/android/tests/nightly_tooling_sweep.py') != ''
        shell: bash
        env:
          PROVISIONING_FAILED: ${{ job.status == 'failure' && steps.execute.outcome == 'skipped' }}
        run: |
          reason=()
          if [[ "$PROVISIONING_FAILED" == 'true' ]]; then
            reason=(--blocked-reason 'Lane provisioning failed before test execution; see setup logs')
          fi
          python3 control/android/tests/nightly_tooling_sweep.py collect \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --lane "$SWEEP_LANE" --output "$GITHUB_WORKSPACE/results" "${reason[@]}"
      - name: Report synthetic XL dialog result
        if: always() && !inputs.retail_assets && hashFiles('plan/plan.json') != ''
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, re
          plan = json.loads(pathlib.Path('plan/plan.json').read_text())
          if any(row.get('id') == 'master:test_xl_feature_browser' for row in plan.get('tests', [])):
              logs = sorted(pathlib.Path('results/master').glob('test_xl_feature_browser_*.log'))
              if not logs:
                  print('Synthetic XL dialog owner log unavailable; inspect setup/runner status')
              for path in logs[-1:]:
                  if path.is_file() and not path.is_symlink():
                      with path.open('rb') as stream:
                          stream.seek(max(0, path.stat().st_size - 16384))
                          text = stream.read(16384).decode('utf-8', errors='replace')
                      print(re.sub(r'\x1b\[[0-9;]*m', '', text))
          PYTHON
      - name: Report sanitized online qualification receipt
        if: always() && steps.selection.outputs.online_preview == 'true'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, pathlib
          receipt = pathlib.Path('results/results.json')
          if receipt.exists():
              data = json.loads(receipt.read_text())
              print(json.dumps({'target_sha': data.get('target_sha'), 'results': [
                  {k: row.get(k) for k in ('id', 'status', 'reason')} for row in data.get('results', [])
              ]}))
          log = pathlib.Path('target/temp/mp_test_log.txt')
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  if 'ONLINE_EVIDENCE ' in line or 'ONLINE_SAMPLE ' in line or 'ONLINE_WORK ' in line or 'ONLINE_WORK_VECTOR ' in line or 'ONLINE_WORK_RESULT ' in line or 'ONLINE_STATE ' in line or 'ONLINE_ADMISSION ' in line or 'ALL CHECKS PASSED' in line:
                      print(line)
          PYTHON
      - name: Collect emulator diagnostics
        if: always() && inputs.lane != 'jvm'
        shell: bash
        run: |
          mkdir -p results/setup
          # Snapshot before killing emulators or restoring the original ACL.
          { id; stat -c '%F %a %U:%G' /dev/kvm; getfacl -p -n /dev/kvm; } > results/setup/kvm-before-cleanup.log 2>&1 || true
          if command -v adb >/dev/null; then
            timeout 15 adb devices -l > results/setup/adb-devices.log 2>&1 || true
            for serial in emulator-5554 emulator-5556 emulator-5558; do
              timeout 15 adb -s "$serial" logcat -d -t 2000 > "results/setup/$serial-logcat.log" 2>&1 || true
              timeout 15 adb -s "$serial" emu kill >/dev/null 2>&1 || true
            done
          fi
      - name: Restore original KVM access
        if: always() && inputs.lane != 'jvm'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/dxx-kvm-acl-changed" ]]; then
            sudo setfacl --restore="$RUNNER_TEMP/dxx-kvm-before.acl"
            getfacl -p -n /dev/kvm > results/setup/kvm-restored.acl
            cmp "$RUNNER_TEMP/dxx-kvm-before.acl" results/setup/kvm-restored.acl
            echo 'Original KVM ACL restored' | tee results/setup/kvm-cleanup.log
          fi
      - name: Record lane lifecycle
        if: always()
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib
          path = pathlib.Path('results/setup')
          path.mkdir(parents=True, exist_ok=True)
          data = {key: os.environ.get(key, '') for key in ('TARGET_SHA', 'SWEEP_LANE', 'DXX_LANE_STARTED_AT', 'SETUP_OUTCOME', 'EXECUTE_OUTCOME')}
          data['finished_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          data['note'] = 'Provisioning/job success is not a test result; only executor journal entries establish coverage'
          (path / 'lifecycle.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Collect public first-play diagnostics
        if: always() && !inputs.retail_assets
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import pathlib, shutil
          temporary = pathlib.Path('target/android/temp')
          destination = pathlib.Path('results/first-play')
          for pattern in ('public-first-play-*', 'lan-launch-preparation-public-shareware', 'lan-host-migration-public-shareware'):
              for source in temporary.glob(pattern):
                  if source.is_dir() and not source.is_symlink():
                      shutil.copytree(source, destination / source.name, dirs_exist_ok=True, symlinks=True)
          # Only the two bounded synthetic-dialog images, never arbitrary app files
          browser = temporary / 'xl-feature-browser'
          if browser.is_dir() and not browser.is_symlink():
              for name in ('xl-feature-browser-light.png', 'xl-feature-browser-dark.png'):
                  source = browser / name
                  if source.is_file() and not source.is_symlink() and source.stat().st_size <= 5242880:
                      target = pathlib.Path('results/xl-feature-browser') / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
          # The executor separately binds the fixed summary to its attempt and exact revision
          three_player = temporary / 'lan-three-player-startup'
          if three_player.is_dir() and not three_player.is_symlink():
              shutil.copytree(three_player, pathlib.Path('results/three-player'), dirs_exist_ok=True, symlinks=True)
          # Only these fixed public-owner snapshots; never collect arbitrary temp content
          graphics_files = ('manifest.json', 'logcat-crash.txt', 'logcat-main.txt', 'logcat-system.txt',
                            'graphics-safety.txt', 'native-fatal.txt', 'exit-info.txt', 'activities.txt',
                            'window.txt', 'power.txt', 'cached-introspect.txt', 'tombstone-list.txt',
                            'tombstone-1.txt', 'tombstone-2.txt')
          for name in ('public-graphics-lifecycle-d1', 'public-graphics-lifecycle-d2'):
              source = temporary / name
              if not source.is_dir() or source.is_symlink():
                  continue
              for filename in graphics_files:
                  path = source / filename
                  if path.is_file() and not path.is_symlink() and path.stat().st_size <= 262144:
                      target = destination / name / filename
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, target)
          # Retain only bounded text from the public automatic-recording owner
          recording_files = ('android.txt', 'guided-rejection.txt', 'recording-listing.json',
                             'automation_result.json.diagnostic.json', 'automation_log.jsonl.diagnostic.json')
          for source in temporary.glob('auto-level-demos-*'):
              if not source.is_dir() or source.is_symlink():
                  continue
              for game in ('d1', 'd2', 'd1-in-d2'):
                  scenario = source / game
                  if scenario.is_symlink():
                      continue
                  for filename in recording_files:
                      path = scenario / filename
                      if path.is_file() and not path.is_symlink():
                          target = pathlib.Path('results/auto-level-demos') / source.name / game / filename
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with path.open('rb') as stream:
                              stream.seek(max(0, path.stat().st_size - 65536))
                              target.write_bytes(stream.read(65536))
          PYTHON
      - name: Upload execution evidence
        if: always() && !inputs.retail_assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-results-${{ inputs.lane }}
          path: results/
          retention-days: 14
          if-no-files-found: error
      - name: Upload Gradle test reports
        if: always() && !inputs.retail_assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-gradle-reports-${{ inputs.lane }}
          path: |
            target/android/app/build/test-results/
            target/android/app/build/reports/tests/
            target/android/mission-metadata-core/build/test-results/
            target/android/mission-metadata-core/build/reports/tests/
            target/android/proxy-tests/build/test-results/
            target/android/proxy-tests/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload generated fixture provenance
        if: always() && !inputs.retail_assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-fixture-provenance-${{ inputs.lane }}
          path: |
            target/android/temp/preview_fixture_*/provenance.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload retail-safe owner receipts
        if: always() && inputs.retail_assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-results-${{ inputs.lane }}
          path: |
            results/results.json
            results/retail-verification.json
          retention-days: 14
          if-no-files-found: warn
      - name: Save provisioned toolchain cache
        timeout-minutes: 5
        continue-on-error: true
        if: always() && !cancelled() && steps.setup.outcome == 'success' && steps.tools.outputs.cache-hit != 'true' && !inputs.retail_assets
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/dxx-nightly-deps/jdk-21
            ${{ runner.temp }}/dxx-nightly-deps/android-ndk-*
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/platforms/android-${{ env.DXX_NIGHTLY_COMPILE_SDK }}*
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/build-tools/${{ env.DXX_NIGHTLY_BUILD_TOOLS }}
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/cmake/${{ env.DXX_NIGHTLY_CMAKE }}
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/cmdline-tools/latest
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/platform-tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Save emulator components
        timeout-minutes: 5
        continue-on-error: true
        if: always() && !cancelled() && inputs.lane != 'jvm' && steps.emulator.outcome == 'success' && steps.emulator-cache.outputs.cache-hit != 'true' && !inputs.retail_assets
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/emulator
            ${{ env.DXX_NIGHTLY_SDK_CACHE }}/system-images/android-${{ env.DXX_NIGHTLY_EMULATOR_API }}/google_apis/x86_64
          key: ${{ steps.emulator-cache.outputs.cache-primary-key }}
      - name: Save completed dependency downloads
        timeout-minutes: 5
        continue-on-error: true
        if: always() && !cancelled() && steps.execute.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' && !inputs.retail_assets
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            target/android/.cxx/dependency-cache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
