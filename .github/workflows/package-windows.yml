name: Package - Windows

on:
  #push:
  #  branches: [ master ]

  #pull_request:
  #  branches: [ master ]

  workflow_dispatch:

  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-physfs
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-SDL_mixer
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-ntldd-git
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld

      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure D1
        run: CC=clang CXX=clang++ cmake -S d1 -B buildd1 -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build D1
        run: cmake --build buildd1 

      - name: Configure D2
        run: CC=clang CXX=clang++ cmake -S d2 -B buildd2 -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build D2
        run: cmake --build buildd2

      - name: List generated PDB files
        run: find buildd1 buildd2 -type f -name '*.pdb'

      - name: Package
        run: ./contrib/packaging/windows/build_package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows
          path: '*.zip'

      - name: Upload symbol artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-symbols-msys-clang-${{ github.sha }}
          path: |
            buildd1/**/*.pdb
            buildd2/**/*.pdb
          if-no-files-found: error
          retention-days: 90
