name: Extended test suite
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0} test sample', github.event.pull_request.number) || github.event_name == 'schedule' && 'Nightly test sweep' || 'Manual test sweep' }}

on:
  schedule:
    - cron: "15 2 * * *"
      timezone: America/Los_Angeles
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/*nightly*"
      - "android/tests/*nightly*"
      - "android/tests/*host_test_suites*"
      - "android/run_all_tests.ps1"
      - "android/helpers/nightly_public_fixture_policy.ps1"
      - "d[12]/main/net*"
      - "d[12]/main/multi*"
      - "android/app/src/main/cpp/shared/net/**"
      - "android/app/src/main/cpp/shared/coop/**"
      - "android/app/src/main/cpp/shared/android_network_profile.*"
      - "android/app/src/main/java/com/dxxredux/app/lobby/**"
      - "android/app/src/main/java/com/dxxredux/app/multiplayer/**"
      - "android/tests/test_lan*"
  workflow_dispatch:
    inputs:
      campaign:
        description: "Bounded test selection"
        type: choice
        options: [nightly, first-play, graphics-capabilities, basic-use, online-preview]
        default: nightly
      evidence_run_id:
        description: "Read sanitized retained online receipt only; no tests or builds"
        type: string
        default: ""
      evidence_kind:
        description: "Fixed retained qualification artifact"
        type: choice
        options: [online, jvm-relay]
        default: online
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ inputs.evidence_run_id && format('online-evidence-{0}', inputs.evidence_run_id) || github.event_name == 'pull_request' && format('nightly-tooling-pr-{0}', github.event.pull_request.number) || inputs.campaign == 'online-preview' && format('online-preview-{0}', github.ref) || 'nightly-cmake-tooling-sweep' }}
  cancel-in-progress: false

jobs:
  online_evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_run_id != ''
    name: Inspect retained online receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate owned online run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.evidence_run_id }}
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == larsonm-personal/dxx-redux ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          if [[ "$EVIDENCE_KIND" == jvm-relay ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > source-jobs.json
          fi
          python3 - <<'PYTHON'
          import json, os
          run = json.load(open('source-run.json'))
          kind = os.environ['EVIDENCE_KIND']
          assert kind in ('online', 'jvm-relay')
          assert run['head_branch'] == 'online-restoration'
          assert run['path'] == '.github/workflows/nightly-tooling-sweep.yml'
          assert run['event'] == ('pull_request' if kind == 'jvm-relay' else 'workflow_dispatch')
          if kind == 'jvm-relay':
              jobs = [job for job in json.load(open('source-jobs.json'))['jobs']
                      if job['name'] == 'JVM tests / Run selected tests']
              assert len(jobs) == 1 and jobs[0]['status'] == 'completed'
          else:
              assert run['status'] == 'completed'
          print(json.dumps({key: run[key] for key in ('id', 'head_sha', 'conclusion')}))
          PYTHON
      - name: Read retained public receipt
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.evidence_kind == 'jvm-relay' && 'nightly-gradle-reports-jvm' || 'nightly-results-android-dual' }}
          path: evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Report bounded sanitized evidence
        env:
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, xml.etree.ElementTree as ET
          def scrub(line):
              line = re.sub(r'\x1b\[[0-9;]*m', '', line)
              line = re.sub(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', '[redacted]', line)
              return re.sub(r'[A-Za-z0-9_+/=-]{24,}', '[redacted]', line)[:500]
          root = pathlib.Path('evidence')
          if os.environ['EVIDENCE_KIND'] == 'jvm-relay':
              paths = list(root.rglob('TEST-com.dxxredux.app.multiplayer.RelayTransportTest.xml'))
              assert len(paths) == 1
              path = paths[0]
              assert not path.is_symlink() and path.stat().st_size < 5000000
              for case in ET.parse(path).getroot().findall('testcase'):
                  for failure in case.findall('failure'):
                      print('JVM_CASE ' + scrub(case.attrib['name']))
                      print('JVM_FAILURE ' + scrub(failure.attrib.get('message', '')))
                      print('\n'.join(scrub(line) for line in (failure.text or '').splitlines()[:35]))
              raise SystemExit(0)
          receipt = json.loads((root / 'results.json').read_text())
          print(json.dumps({'target_sha': receipt['target_sha'], 'results': [
              {key: scrub(str(row.get(key, ''))) for key in ('id', 'status', 'reason')}
              for row in receipt.get('results', [])
          ]}))
          markers = ('FAIL', 'EXCEPTION:', 'ONLINE_', 'ALL CHECKS PASSED', 'Error:', 'error:',
                     'test_mp', 'timed out', 'Timeout', 'Phase ', 'at ', 'line:')
          paths = [root / 'master.log']
          paths.extend((root / 'master').rglob('*test_mp*.txt'))
          paths.extend((root / 'master').rglob('*test_mp*.log'))
          for path in paths:
              if path.is_file() and not path.is_symlink() and path.stat().st_size < 10000000:
                  print('RECEIPT_FILE ' + str(path.relative_to(root)))
                  lines = [scrub(line) for line in path.read_text(errors='replace').splitlines()
                           if path.name.startswith('test_mp_public_shareware') or any(marker in line for marker in markers)]
                  print('\n'.join(lines[-300:]))
          PYTHON

  plan:
    if: ${{ !inputs.evidence_run_id && (github.event.action != 'labeled' || github.event.label.name == 'release-first-play') }}
    name: Select tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.plan.outputs.target_sha }}
      lanes: ${{ steps.plan.outputs.lanes }}
      android_lanes: ${{ steps.plan.outputs.android_lanes }}
      count: ${{ steps.plan.outputs.count }}
      retail_lanes: ${{ steps.plan.outputs.retail_lanes }}
      retail_commit: ${{ steps.plan.outputs.retail_commit }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Resolve exact test target once
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          CAMPAIGN_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.campaign == 'first-play' || inputs.campaign == 'graphics-capabilities' || inputs.campaign == 'basic-use' || inputs.campaign == 'online-preview') && github.sha || '' }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/cmake" --jq .object.sha)"
          if [[ -n "$PR_SHA" ]]; then sha="$PR_SHA"; fi
          if [[ -n "$CAMPAIGN_SHA" ]]; then sha="$CAMPAIGN_SHA"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact target catalog
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: target
          persist-credentials: false
      - name: Prepare host dependency location
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-nightly-deps" target/android/temp target/temp
          printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > target/dependency_base.txt
      - name: Export authoritative master catalog
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path plan -Force | Out-Null
          & ./target/android/run_all_tests.ps1 -ListTests -ExtendedGraphics | Set-Content plan/catalog.json -Encoding utf8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Plan unfinished tests without advancing progress
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          VALIDATION: ${{ github.event_name == 'pull_request' }}
          FIRST_PLAY: ${{ inputs.campaign == 'first-play' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-first-play')) }}
          ONLINE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'online-preview' }}
          BASIC_USE: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'basic-use' }}
          GRAPHICS_CAPABILITIES: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'graphics-capabilities' }}
          RETAIL_ASSETS_COMMIT: ${{ vars.RETAIL_ASSETS_COMMIT }}
        run: |
          python3 control/android/tests/nightly_tooling_sweep.py fetch-state --output plan/previous.json
          validation=()
          if [[ "$ONLINE_PREVIEW" == true ]]; then
            validation=(--campaign online-preview)
          elif [[ "$BASIC_USE" == true ]]; then
            validation=(--campaign basic-use)
          elif [[ "$FIRST_PLAY" == true ]]; then
            validation=(--campaign first-play)
          elif [[ "$GRAPHICS_CAPABILITIES" == true ]]; then
            validation=(--campaign graphics-capabilities)
          elif [[ "$VALIDATION" == true ]]; then
            validation=(--validation)
          fi
          # The unconditional public LAN workflow owns this test on every PR
          if [[ "$VALIDATION" == true ]]; then validation+=(--omit-pr-public-lan); fi
          python3 control/android/tests/nightly_tooling_sweep.py plan \
            --target-sha "$TARGET_SHA" --catalog plan/catalog.json \
            --policy control/android/tests/nightly_tooling_policy.json --state plan/previous.json \
            --output plan/plan.json --state-output plan/state.json "${validation[@]}"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'control/android/tests')
          from nightly_retail import lane_requires_retail
          p=json.load(open('plan/plan.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('target_sha='+p['target_sha']+'\n')
              f.write('lanes='+json.dumps(p['lanes'])+'\n')
              f.write('android_lanes='+json.dumps([x for x in p['lanes'] if x!='host'])+'\n')
              f.write('count='+str(len(p['tests']))+'\n')
              f.write('retail_lanes='+json.dumps(sorted(lane for lane in p['lanes'] if lane_requires_retail(p, lane)))+'\n')
              f.write('retail_commit='+p.get('retail_assets',{}).get('commit','')+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-plan
          path: plan/
          retention-days: 30

  host:
    name: Linux tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'host')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: ${{ contains(fromJSON(needs.plan.outputs.retail_lanes), 'host') && github.repository == 'larsonm-personal/dxx-redux' && github.ref == 'refs/heads/cmake' && github.workflow_ref == 'larsonm-personal/dxx-redux/.github/workflows/nightly-tooling-sweep.yml@refs/heads/cmake' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'retail-ci' || 'asset-free' }}
    env:
      RETAIL_ASSETS_COMMIT: ${{ vars.RETAIL_ASSETS_COMMIT }}
      RETAIL_CHECKOUT_COMMIT: ${{ needs.plan.outputs.retail_commit }}
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-plan
          path: plan
      - name: Install host prerequisites
        id: prerequisites
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential clang cmake ninja-build \
            libphysfs-dev libsdl1.2-dev libsdl-mixer1.2-dev libpng-dev libglew-dev zlib1g-dev \
            xvfb xauth libgl1-mesa-dri ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/dxx-nightly-python"
          "$RUNNER_TEMP/dxx-nightly-python/bin/python" -m pip install -r control/android/tests/music_spectral/requirements.txt
          "$RUNNER_TEMP/dxx-nightly-python/bin/python" -m pip check
          echo "$RUNNER_TEMP/dxx-nightly-python/bin" >> "$GITHUB_PATH"
      - name: Prepare host dependency location
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-nightly-deps" target/android/temp target/temp
          printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > target/dependency_base.txt
      - name: Prepare verified public fixture runtime
        id: public_prerequisites
        timeout-minutes: 8
        run: |
          bash target/android/get_deps/helpers/get_bounded_python.sh
          command -v ffmpeg
          command -v ffprobe
      - name: Prepare asset-free metadata CLI
        id: metadata_cli_prerequisites
        timeout-minutes: 15
        env:
          VALIDATE_METADATA_CLI: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "$VALIDATE_METADATA_CLI" != true ]] && ! python3 -c "import json,sys; p=json.load(open('plan/plan.json')); sys.exit(not any(e.get('fixture') == 'retail-corpus' for e in p['tests']))"; then
            exit 0
          fi
          bash target/android/get_deps/helpers/get_jdk.sh
          export JAVA_HOME="$RUNNER_TEMP/dxx-nightly-deps/jdk-21"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          # The wrapper JAR and properties are generated, not tracked
          bash target/android/get_deps/helpers/get_gradle_wrapper.sh
          bash target/android/gradlew -p target/android -PhostJvmOnly=true :mission-metadata-cli:installDist --console=plain
          test -x target/android/mission-metadata-cli/build/install/mission-metadata-cli/bin/mission-metadata-cli
      - name: Prepare locked formatter dependencies
        id: formatter_prerequisites
        timeout-minutes: 8
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) { throw new Error("Node 20 or newer is required"); }'
          npm ci --prefix target/android/tools/code-quality --ignore-scripts
      - name: Verify trusted retail checkout boundary
        id: retail_gate
        env:
          RETAIL_READ_TOKEN: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
        if: contains(fromJSON(needs.plan.outputs.retail_lanes), 'host')
        run: |
          [[ -n "$RETAIL_READ_TOKEN" ]] || { echo "Retail read-only environment secret is missing" >&2; exit 1; }
          unset RETAIL_READ_TOKEN
          [[ "$RETAIL_CHECKOUT_COMMIT" == "$RETAIL_ASSETS_COMMIT" ]]
          python3 control/android/tests/nightly_tooling_sweep.py retail-check \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json --lane host
      - name: Check out immutable private retail inputs
        id: retail_checkout
        if: contains(fromJSON(needs.plan.outputs.retail_lanes), 'host')
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: larsonm-personal/dxx-redux-test-assets
          ref: ${{ needs.plan.outputs.retail_commit }}
          token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          path: retail-input
          persist-credentials: false
      - name: Verify supplied edition and stage base retail files
        if: contains(fromJSON(needs.plan.outputs.retail_lanes), 'host')
        id: retail_stage
        run: |
          [[ "$(git -C retail-input rev-parse HEAD)" == "$RETAIL_CHECKOUT_COMMIT" ]]
          python3 control/android/helpers/retail_ci_assets.py --root retail-input --repo control --source-map control/android/tests/retail_asset_sources.json \
            --output results/retail-verification.json --stage target/game_data/retail-ci --include-missions
          # Stage only the immutable demo pair when its owner was admitted
          if python3 -c "import json,sys; p=json.load(open('plan/plan.json')); sys.exit(not any(e.get('fixture') == 'retail-demos' for e in p['tests']))"; then
            python3 control/android/tests/private_input_demos.py --stage --demos retail-input/demos --output target/game_data/retail-ci/demos
          fi
          # The existing immutable checkout and trusted gate also own corpus staging
          if python3 -c "import json,sys; p=json.load(open('plan/plan.json')); sys.exit(not any(e.get('fixture') == 'retail-corpus' for e in p['tests']))"; then
            python3 control/android/tests/nightly_regression_catalog.py --source retail-input --repo target --commit "$RETAIL_CHECKOUT_COMMIT"
          fi
          rm -rf retail-input
      - name: Execute admitted host owners
        id: execute
        timeout-minutes: 65
        run: |
          python3 control/android/tests/nightly_tooling_sweep.py execute \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --lane host --repo target --output results
      - name: Recover completed receipts after failure or interruption
        if: always()
        env:
          SETUP_FAILED: ${{ (steps.prerequisites.outcome == 'failure' || steps.public_prerequisites.outcome == 'failure' || steps.metadata_cli_prerequisites.outcome == 'failure' || steps.formatter_prerequisites.outcome == 'failure' || steps.retail_stage.outcome == 'failure' || steps.retail_gate.outcome == 'failure' || steps.retail_checkout.outcome == 'failure') && steps.execute.outcome == 'skipped' }}
        run: |
          blocked=()
          if [[ "$SETUP_FAILED" == true ]]; then blocked=(--blocked-reason 'host lane provisioning failed; inspect setup logs'); fi
          python3 control/android/tests/nightly_tooling_sweep.py collect \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --lane host --output results "${blocked[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && !contains(fromJSON(needs.plan.outputs.retail_lanes), 'host')
        with:
          name: nightly-results-host
          path: |
            results/
            !results/build/**
          retention-days: 14
          if-no-files-found: warn
      - name: Upload retail-safe owner receipts
        if: always() && contains(fromJSON(needs.plan.outputs.retail_lanes), 'host')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-results-host
          path: |
            results/results.json
            results/retail-verification.json
          retention-days: 14
          if-no-files-found: warn

  android:
    name: ${{ matrix.lane == 'jvm' && 'JVM tests' || matrix.lane == 'android-dual' && 'Multi-device tests' || 'Android tests' }}
    needs: plan
    if: needs.plan.outputs.android_lanes != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3 # Plus the separate host executor: at most four test lanes.
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.android_lanes) }}
    uses: ./.github/workflows/android-nightly-tooling.yml
    with:
      target_sha: ${{ needs.plan.outputs.target_sha }}
      plan_artifact: nightly-plan
      lane: ${{ matrix.lane }}
      retail_assets: ${{ contains(fromJSON(needs.plan.outputs.retail_lanes), matrix.lane) }}
      retail_commit: ${{ needs.plan.outputs.retail_commit }}
    # Explicitly name the environment-only secret; the callee keeps its trusted retail-ci gate
    secrets:
      RETAIL_ASSETS_READ_TOKEN: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}

  finish:
    name: Check results
    needs: [plan, host, android]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-plan
          path: plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: nightly-results-*
          path: receipts
      - name: Reconcile terminal results and retain unresolved failures
        env:
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          REQUIRE_SELECTED: ${{ inputs.campaign == 'online-preview' || github.event_name == 'pull_request' || inputs.campaign == 'first-play' || inputs.campaign == 'graphics-capabilities' || inputs.campaign == 'basic-use' }}
        run: |
          qualification=()
          if [[ "$REQUIRE_SELECTED" == 'true' ]]; then qualification=(--require-selected); fi
          status=0
          mapfile -t receipts < <(find receipts -mindepth 1 -maxdepth 2 -type f \( -path 'receipts/results.json' -o -path 'receipts/nightly-results-*/results.json' \) 2>/dev/null | sort)
          python3 control/android/tests/nightly_tooling_sweep.py reconcile \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --state plan/state.json --output summary-state.json "${qualification[@]}" --receipts "${receipts[@]}" > summary.json || status=$?
          {
            echo '## Nightly tooling sweep'
            echo 'Exact target, completed owners, unresolved failures, blocked suites and exclusions:'
            echo '```json'
            cat summary.json
            echo '```'
            echo 'No result means pending. Infrastructure blockages are not coverage and retry next night; stable exclusions remain explicit.'
            echo 'A completed sweep stops selecting tests until the target or admitted catalog changes.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: nightly-sweep-summary
          path: |
            summary.json
            summary-state.json
            published-state.json
          retention-days: 30

  publish:
    name: Save nightly progress (scheduled/manual only)
    needs: [plan, finish]
    if: always() && needs.finish.result == 'success' && github.event_name != 'pull_request' && inputs.campaign != 'first-play' && inputs.campaign != 'graphics-capabilities' && inputs.campaign != 'basic-use' && inputs.campaign != 'online-preview' && (github.ref == 'refs/heads/cmake' || (github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-plan
          path: plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: nightly-results-*
          path: receipts
      - name: Publish only completed progress to dedicated state branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        run: |
          mapfile -t receipts < <(find receipts -mindepth 1 -maxdepth 2 -type f \( -path 'receipts/results.json' -o -path 'receipts/nightly-results-*/results.json' \) 2>/dev/null | sort)
          python3 control/android/tests/nightly_tooling_sweep.py publish \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --expected-target "$TARGET_SHA" --output published-state.json --receipts "${receipts[@]}"
