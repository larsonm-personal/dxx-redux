name: Extended test suite
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0} test sample', github.event.pull_request.number) || github.event_name == 'schedule' && 'Nightly test sweep' || 'Manual test sweep' }}

on:
  schedule:
    - cron: "15 2 * * *"
      timezone: America/Los_Angeles
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      campaign:
        description: "Bounded test selection"
        type: choice
        options:
          [
            nightly,
            first-play,
            graphics-capabilities,
            xl-browser,
            xl-textures,
            xl-originals,
            xl-fast,
            pumo-stage,
            basic-use,
            online-preview,
            online-preview-d2,
            online-transports,
          ]
        default: nightly
      candidate_pr:
        description: "Own same-repository PR to qualify from cmake (XL campaigns only)"
        type: string
        default: ""
      candidate_sha:
        description: "Full PR head SHA explicitly trusted with private assets"
        type: string
        default: ""
      evidence_run_id:
        description: "Read sanitized retained online receipt only; no tests or builds"
        type: string
        default: ""
      evidence_kind:
        description: "Fixed retained qualification artifact"
        type: choice
        options: [online, jvm-relay]
        default: online
  workflow_call:
    secrets:
      RETAIL_ASSETS_READ_TOKEN:
        required: true
    inputs:
      campaign:
        type: string
        default: ""
      candidate_pr:
        type: string
        default: ""
      candidate_sha:
        type: string
        default: ""
      source_run_id:
        type: string
        default: ""

permissions:
  contents: read

env:
  NIGHTLY_SAMPLE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.campaign == 'nightly' && !inputs.evidence_run_id) }}
  CANDIDATE_PR: ${{ inputs.candidate_pr }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CANDIDATE_CAMPAIGN: ${{ inputs.campaign }}
  XL_SOURCE_RUN_ID: ${{ inputs.source_run_id }}

concurrency:
  group: ${{ inputs.evidence_run_id && format('online-evidence-{0}', inputs.evidence_run_id) || github.event_name == 'pull_request' && format('nightly-tooling-pr-{0}', github.event.pull_request.number) || (inputs.campaign == 'online-preview' || inputs.campaign == 'online-preview-d2' || inputs.campaign == 'online-transports') && format('online-preview-{0}', github.ref) || github.event_name == 'workflow_run' && format('xl-pr-assets-{0}', inputs.candidate_pr) || 'nightly-cmake-tooling-sweep' }}
  cancel-in-progress: false
  # Default single pending slot: finish the active sweep and replace only unstarted successors

jobs:
  stack:
    uses: ./.github/workflows/stack-ci.yml
    with:
      profile: extended

  online_evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_run_id != ''
    name: Inspect retained online receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate owned online run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.evidence_run_id }}
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == larsonm-personal/dxx-redux ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          if [[ "$EVIDENCE_KIND" == jvm-relay ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > source-jobs.json
          fi
          python3 - <<'PYTHON'
          import json, os
          run = json.load(open('source-run.json'))
          kind = os.environ['EVIDENCE_KIND']
          assert kind in ('online', 'jvm-relay')
          assert run['head_branch'] == 'online-restoration'
          assert run['path'] == '.github/workflows/nightly-tooling-sweep.yml'
          assert run['event'] == ('pull_request' if kind == 'jvm-relay' else 'workflow_dispatch')
          if kind == 'jvm-relay':
              jobs = [job for job in json.load(open('source-jobs.json'))['jobs']
                      if job['name'] == 'JVM tests / Run selected tests']
              assert len(jobs) == 1 and jobs[0]['status'] == 'completed'
          else:
              assert run['status'] == 'completed'
          print(json.dumps({key: run[key] for key in ('id', 'head_sha', 'conclusion')}))
          PYTHON
      - name: Read retained public receipt
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.evidence_kind == 'jvm-relay' && 'nightly-gradle-reports-jvm' || 'nightly-results-android-dual' }}
          path: evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Report bounded sanitized evidence
        env:
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, xml.etree.ElementTree as ET
          def scrub(line):
              line = re.sub(r'\x1b\[[0-9;]*m', '', line)
              line = re.sub(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', '[redacted]', line)
              return re.sub(r'[A-Za-z0-9_+/=-]{24,}', '[redacted]', line)[:500]
          root = pathlib.Path('evidence')
          if os.environ['EVIDENCE_KIND'] == 'jvm-relay':
              paths = list(root.rglob('TEST-com.dxxredux.app.multiplayer.RelayTransportTest.xml'))
              assert len(paths) == 1
              path = paths[0]
              assert not path.is_symlink() and path.stat().st_size < 5000000
              for case in ET.parse(path).getroot().findall('testcase'):
                  for failure in case.findall('failure'):
                      print('JVM_CASE ' + scrub(case.attrib['name']))
                      print('JVM_FAILURE ' + scrub(failure.attrib.get('message', '')))
                      print('\n'.join(scrub(line) for line in (failure.text or '').splitlines()[:35]))
              raise SystemExit(0)
          receipt = json.loads((root / 'results.json').read_text())
          # Fixed event categories only: never print raw native or authentication log bodies
          event_markers = {
              'refuse_stuff: prompting': 'host_approval_pending',
              'refuse_stuff: ACCEPTED': 'host_approval_accepted',
              'refuse_stuff: TIMEOUT': 'host_approval_timeout',
              'refuse_stuff: REJECTED full': 'host_roster_full',
              'welcome_player: REJECTED endlevel': 'native_endlevel_rejected',
              'welcome_player: REJECTED level mismatch': 'native_level_rejected',
              'read_object_packet: SYNC FAILED': 'native_object_sync_failed',
              'sync rejected local identity': 'native_identity_rejected',
              'event=admission_received': 'native_admission_received',
              'event=initial_route_proven': 'native_route_proven',
              'Late-join approved: slot': 'relay_route_assignment_received',
          }
          for serial in ('emulator-5554', 'emulator-5556', 'emulator-5558'):
              path = root / 'setup' / (serial + '-logcat.log')
              if not path.is_file() or path.is_symlink() or not path.resolve().is_relative_to(root.resolve()) or path.stat().st_size > 10000000:
                  continue
              counts = {event: 0 for event in event_markers.values()}
              for line in path.read_text(errors='replace').splitlines():
                  for marker, event in event_markers.items():
                      if marker in line:
                          counts[event] += 1
              print('ONLINE_NATIVE_EVENTS ' + json.dumps({'client': serial, 'retained_tail_counts': counts}))
          print(json.dumps({'target_sha': receipt['target_sha'], 'results': [
              {key: scrub(str(row.get(key, ''))) for key in ('id', 'status', 'reason')}
              for row in receipt.get('results', [])
          ]}))
          markers = ('FAIL', 'EXCEPTION:', 'ONLINE_', 'ALL CHECKS PASSED', 'Error:', 'error:',
                     'test_mp', 'timed out', 'Timeout', 'Phase ', 'at ', 'line:')
          paths = [root / 'master.log']
          paths.extend((root / 'master').rglob('*test_mp*.txt'))
          paths.extend((root / 'master').rglob('*test_mp*.log'))
          for path in paths:
              if path.is_file() and not path.is_symlink() and path.stat().st_size < 10000000:
                  print('RECEIPT_FILE ' + str(path.relative_to(root)))
                  lines = [scrub(line) for line in path.read_text(errors='replace').splitlines()
                           if path.name.startswith('test_mp_public_shareware') or any(marker in line for marker in markers)]
                  print('\n'.join(lines[-300:]))
          PYTHON

  plan:
    needs: stack
    if: ${{ needs.stack.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.campaign == 'pumo-stage') && !inputs.evidence_run_id && (github.event.action != 'labeled' || github.event.label.name == 'release-first-play') }}
    name: Select tests
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_ref: ${{ steps.target.outputs.ref }}
      activity_id: ${{ steps.target.outputs.activity_id }}
      host_matrix: ${{ steps.plan.outputs.host_matrix }}
      android_matrix: ${{ steps.plan.outputs.android_matrix }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      lanes: ${{ steps.plan.outputs.lanes }}
      android_lanes: ${{ steps.plan.outputs.android_lanes }}
      count: ${{ steps.plan.outputs.count }}
      supplemental: ${{ steps.plan.outputs.supplemental }}
      retail_lanes: ${{ steps.plan.outputs.retail_lanes }}
      retail_commit: ${{ steps.plan.outputs.retail_commit }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Resolve exact test target once
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          CAMPAIGN_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.campaign == 'first-play' || inputs.campaign == 'graphics-capabilities' || inputs.campaign == 'xl-browser' || inputs.campaign == 'xl-textures' || inputs.campaign == 'xl-originals' || inputs.campaign == 'xl-fast' || inputs.campaign == 'basic-use' || inputs.campaign == 'online-preview' || inputs.campaign == 'online-preview-d2' || inputs.campaign == 'online-transports') && github.sha || '' }}
        run: |
          if [[ "$NIGHTLY_SAMPLE" == true ]]; then
            python3 control/android/tests/nightly_revision.py
            exit 0
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/cmake" --jq .object.sha)"
          if [[ -n "$PR_SHA" ]]; then sha="$PR_SHA"; fi
          if [[ -n "$CAMPAIGN_SHA" ]]; then sha="$CAMPAIGN_SHA"; fi
          candidate="$(python3 control/android/tests/nightly_candidate.py)"
          if [[ -n "$candidate" ]]; then sha="$candidate"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact target catalog
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: target
          persist-credentials: false
      - name: Prepare host dependency location
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-nightly-deps" target/android/temp target/temp
          printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > target/dependency_base.txt
          if [[ -n "$CANDIDATE_PR$CANDIDATE_SHA" || "$NIGHTLY_SAMPLE" == true ]]; then
            printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > control/dependency_base.txt
          fi
      - name: Export authoritative master catalog
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path plan -Force | Out-Null
          $catalogRoot = if ($env:CANDIDATE_PR -or $env:CANDIDATE_SHA) { "control" } else { "target" }
          if ($env:NIGHTLY_SAMPLE -eq "true") { $catalogRoot = "control" }
          & ./$catalogRoot/android/run_all_tests.ps1 -ListTests -ExtendedGraphics -ExtendedMultiplayer | Set-Content plan/catalog.json -Encoding utf8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Plan unfinished tests without advancing progress
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          VALIDATION: ${{ github.event_name == 'pull_request' }}
          FIRST_PLAY: ${{ inputs.campaign == 'first-play' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-first-play')) }}
          ONLINE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'online-preview' }}
          ONLINE_PREVIEW_D2: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'online-preview-d2' }}
          ONLINE_TRANSPORTS: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'online-transports' }}
          BASIC_USE: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'basic-use' }}
          XL_BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'xl-browser' }}
          XL_ORIGINALS: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'xl-originals' }}
          XL_FAST: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') && inputs.campaign == 'xl-fast' }}
          XL_TEXTURES: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'xl-textures' }}
          GRAPHICS_CAPABILITIES: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign == 'graphics-capabilities' }}
          RETAIL_ASSETS_COMMIT: ${{ vars.RETAIL_ASSETS_COMMIT }}
        run: |
          if [[ "$NIGHTLY_SAMPLE" == true ]]; then
            python3 control/android/tests/nightly_sample.py plan
            exit 0
          fi
          python3 control/android/tests/nightly_tooling_sweep.py fetch-state --output plan/previous.json
          validation=()
          if [[ "$ONLINE_PREVIEW" == true ]]; then
            validation=(--campaign online-preview)
          elif [[ "$ONLINE_PREVIEW_D2" == true ]]; then
            validation=(--campaign online-preview-d2)
          elif [[ "$ONLINE_TRANSPORTS" == true ]]; then
            validation=(--campaign online-transports)
          elif [[ "$BASIC_USE" == true ]]; then
            validation=(--campaign basic-use)
          elif [[ "$FIRST_PLAY" == true ]]; then
            validation=(--campaign first-play)
          elif [[ "$XL_ORIGINALS" == true ]]; then
            validation=(--campaign xl-originals)
          elif [[ "$XL_FAST" == true ]]; then
            validation=(--campaign xl-fast)
          elif [[ "$XL_TEXTURES" == true ]]; then
            validation=(--campaign xl-textures)
          elif [[ "$XL_BROWSER" == true ]]; then
            validation=(--campaign xl-browser)
          elif [[ "$GRAPHICS_CAPABILITIES" == true ]]; then
            validation=(--campaign graphics-capabilities)
          elif [[ "$VALIDATION" == true ]]; then
            validation=(--validation)
          fi
          # The unconditional public LAN workflow owns this test on every PR
          if [[ "$VALIDATION" == true ]]; then validation+=(--omit-pr-public-lan); fi
          python3 control/android/tests/nightly_tooling_sweep.py plan \
            --target-sha "$TARGET_SHA" --catalog plan/catalog.json \
            --policy control/android/tests/nightly_tooling_policy.json --state plan/previous.json \
            --output plan/plan.json --state-output plan/state.json "${validation[@]}"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'control/android/tests')
          from nightly_retail import lane_requires_retail
          p=json.load(open('plan/plan.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('host_matrix='+json.dumps([{'shard':'', 'lane':'host', 'retail':lane_requires_retail(p,'host')}])+'\n')
              f.write('android_matrix='+json.dumps([{'shard':'', 'lane':lane, 'retail':lane_requires_retail(p,lane)} for lane in p['lanes'] if lane!='host'])+'\n')
              f.write('target_sha='+p['target_sha']+'\n')
              f.write('lanes='+json.dumps(p['lanes'])+'\n')
              f.write('android_lanes='+json.dumps([x for x in p['lanes'] if x!='host'])+'\n')
              f.write('count='+str(len(p['tests']))+'\n')
              f.write('retail_lanes='+json.dumps(sorted(lane for lane in p['lanes'] if lane_requires_retail(p, lane)))+'\n')
              f.write('retail_commit='+p.get('retail_assets',{}).get('commit','')+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-plan
          path: plan/
          retention-days: 30

  host:
    name: ${{ matrix.shard != '' && format('Linux tests {0}', matrix.shard) || 'Linux tests' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.host_matrix) }}
    needs: [plan, execution-stack]
    if: needs.execution-stack.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.lanes), 'host')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.campaign == 'nightly') && 55 || 100 }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Keep deployment tracking for trusted retail jobs only
    environment:
      name: ${{ matrix.retail && github.repository == 'larsonm-personal/dxx-redux' && github.ref == 'refs/heads/cmake' && ((github.workflow_ref == 'larsonm-personal/dxx-redux/.github/workflows/nightly-tooling-sweep.yml@refs/heads/cmake' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || (github.workflow_ref == 'larsonm-personal/dxx-redux/.github/workflows/xl-pr-assets.yml@refs/heads/cmake' && github.event_name == 'workflow_run')) && 'retail-ci' || 'asset-free' }}
      deployment: ${{ matrix.retail && github.repository == 'larsonm-personal/dxx-redux' && github.ref == 'refs/heads/cmake' && ((github.workflow_ref == 'larsonm-personal/dxx-redux/.github/workflows/nightly-tooling-sweep.yml@refs/heads/cmake' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || (github.workflow_ref == 'larsonm-personal/dxx-redux/.github/workflows/xl-pr-assets.yml@refs/heads/cmake' && github.event_name == 'workflow_run')) }}
    env:
      NIGHTLY_TARGET_SHA: ${{ needs.plan.outputs.target_ref != '' && needs.plan.outputs.target_sha || '' }}
      NIGHTLY_TARGET_REF: ${{ needs.plan.outputs.target_ref }}
      NIGHTLY_ACTIVITY_ID: ${{ needs.plan.outputs.activity_id }}
      RETAIL_ASSETS_COMMIT: ${{ vars.RETAIL_ASSETS_COMMIT }}
      RETAIL_CHECKOUT_COMMIT: ${{ needs.plan.outputs.retail_commit }}
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-plan
          path: plan
      - name: Select bounded shard
        if: matrix.shard != ''
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          [[ "$SHARD" =~ ^shard-[0-9]{3}$ ]]
          cp "plan/$SHARD.json" plan/plan.json
      - name: Check remaining nightly allowance before provisioning
        if: env.NIGHTLY_SAMPLE == 'true'
        run: python3 control/android/tests/nightly_sample.py check-deadline
      - name: Prepare trusted dependency location
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-nightly-deps" control/android/temp control/temp
          printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > control/dependency_base.txt
      - name: Verify trusted retail checkout boundary
        id: retail_gate
        env:
          GH_TOKEN: ${{ github.token }}
        if: matrix.retail
        run: |
          [[ "$RETAIL_CHECKOUT_COMMIT" == "$RETAIL_ASSETS_COMMIT" ]]
          python3 control/android/tests/nightly_tooling_sweep.py retail-check \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json --lane host
      - name: Check admitted retail credential availability
        if: matrix.retail
        env:
          RETAIL_TOKEN_AVAILABLE: ${{ secrets.RETAIL_ASSETS_READ_TOKEN != '' }}
        run: |
          if [[ "$RETAIL_TOKEN_AVAILABLE" != 'true' ]]; then
            echo '::error::Private retail checkout token unavailable; check named reusable secret forwarding and retail-ci secret configuration'
            exit 1
          fi
      - name: Check out immutable private retail inputs
        id: retail_checkout
        if: matrix.retail
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: larsonm-personal/dxx-redux-test-assets
          ref: ${{ needs.plan.outputs.retail_commit }}
          token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          path: retail-input
          persist-credentials: false
      - name: Verify supplied edition and stage base retail files
        if: matrix.retail
        id: retail_stage
        run: |
          [[ "$(git -C retail-input rev-parse HEAD)" == "$RETAIL_CHECKOUT_COMMIT" ]]
          python3 control/android/helpers/retail_ci_assets.py --root retail-input --repo control --source-map control/android/tests/retail_asset_sources.json \
            --output results/retail-verification.json --stage target/game_data/retail-ci --include-missions
          # Stage only the immutable demo pair when its owner was admitted
          if python3 -c "import json,sys; p=json.load(open('plan/plan.json')); sys.exit(not any(e.get('fixture') == 'retail-demos' for e in p['tests']))"; then
            python3 control/android/tests/private_input_demos.py --stage --demos retail-input/demos --output target/game_data/retail-ci/demos
          fi
          # The existing immutable checkout and trusted gate also own corpus staging
          if python3 -c "import json,sys; p=json.load(open('plan/plan.json')); sys.exit(not any(e.get('fixture') == 'retail-corpus' for e in p['tests']))"; then
            python3 control/android/tests/nightly_regression_catalog.py --source retail-input --repo target --commit "$RETAIL_CHECKOUT_COMMIT"
          fi
          # Original XL owners require verified, complete private inputs
          if python3 -c "import json,sys; p=json.load(open('plan/plan.json')); sys.exit(not any(e['id'] in ('host-profile:retail-xl-originals', 'host-profile:retail-xl-fast') for e in p['tests']))"; then
            pwsh -NoProfile -Command "\$tool = & ./control/android/get_deps/helpers/get_7zip.ps1; Set-Content -LiteralPath results/xl-seven-zip.txt -Value \$tool -NoNewline"
            modern=()
            if python3 -c "import json,sys; p=json.load(open('plan/plan.json')); sys.exit(not any(e['id'] == 'host-profile:retail-xl-fast' for e in p['tests']))"; then modern=(--modern); fi
            python3 control/android/tests/xl_private_assets.py --root retail-input --stage target/game_data/retail-ci/xl --seven-zip "$(cat results/xl-seven-zip.txt)" "${modern[@]}"
          fi
          rm -rf retail-input
      - name: Install host prerequisites
        id: prerequisites
        timeout-minutes: 15
        run: |
          # Reuse hosted tools, as in engine CI, rather than install a second toolchain
          for tool in cc c++ make clang cmake ctest ninja; do
            if ! command -v "$tool" || ! "$tool" --version; then
              echo "::error::Hosted tool '$tool' is missing or cannot run"
              exit 1
            fi
          done
          python3 control/.github/scripts/prefer_ubuntu_archive.py
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            libphysfs-dev libsdl1.2-dev libsdl-mixer1.2-dev libpng-dev libglew-dev zlib1g-dev \
            xvfb xauth libgl1-mesa-dri libegl1-mesa-dev ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/dxx-nightly-python"
          "$RUNNER_TEMP/dxx-nightly-python/bin/python" -m pip install -r control/android/tests/music_spectral/requirements.txt
          "$RUNNER_TEMP/dxx-nightly-python/bin/python" -m pip check
          echo "$RUNNER_TEMP/dxx-nightly-python/bin" >> "$GITHUB_PATH"
      - name: Prepare host dependency location
        run: |
          mkdir -p "$RUNNER_TEMP/dxx-nightly-deps" target/android/temp target/temp
          printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > target/dependency_base.txt
          if [[ -n "$CANDIDATE_PR$CANDIDATE_SHA" || "$NIGHTLY_SAMPLE" == true ]]; then
            printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > control/dependency_base.txt
          fi
      - name: Prepare verified public fixture runtime
        id: public_prerequisites
        timeout-minutes: 8
        run: |
          setup=target
          if [[ -n "$CANDIDATE_PR$CANDIDATE_SHA" ]]; then setup=control; fi
          bash "$setup/android/get_deps/helpers/get_bounded_python.sh"
          command -v ffmpeg
          command -v ffprobe
      - name: Prepare asset-free metadata CLI
        id: metadata_cli_prerequisites
        timeout-minutes: 15
        env:
          VALIDATE_METADATA_CLI: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ -n "$CANDIDATE_PR$CANDIDATE_SHA" ]]; then exit 0; fi
          if [[ "$VALIDATE_METADATA_CLI" != true ]] && ! python3 -c "import json,sys; p=json.load(open('plan/plan.json')); sys.exit(not any(e.get('fixture') == 'retail-corpus' for e in p['tests']))"; then
            exit 0
          fi
          bash target/android/get_deps/helpers/get_jdk.sh
          export JAVA_HOME="$RUNNER_TEMP/dxx-nightly-deps/jdk-21"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          # The wrapper JAR and properties are generated, not tracked
          bash target/android/get_deps/helpers/get_gradle_wrapper.sh
          bash target/android/gradlew -p target/android -PhostJvmOnly=true :mission-metadata-cli:installDist --console=plain
          test -x target/android/mission-metadata-cli/build/install/mission-metadata-cli/bin/mission-metadata-cli
      - name: Prepare locked formatter dependencies
        id: formatter_prerequisites
        timeout-minutes: 8
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) { throw new Error("Node 20 or newer is required"); }'
          setup=target
          if [[ -n "$CANDIDATE_PR$CANDIDATE_SHA" ]]; then setup=control; fi
          npm ci --prefix "$setup/android/tools/code-quality" --ignore-scripts
      - name: Execute admitted host owners
        id: execute
        timeout-minutes: 50
        run: |
          if [[ "$NIGHTLY_SAMPLE" == true ]]; then
            python3 control/android/tests/nightly_sample.py execute --lane host
            exit $?
          fi
          python3 control/android/tests/nightly_tooling_sweep.py execute \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --lane host --repo target --output results
      - name: Recover completed receipts after failure or interruption
        if: always()
        env:
          SETUP_FAILED: ${{ (steps.prerequisites.outcome == 'failure' || steps.public_prerequisites.outcome == 'failure' || steps.metadata_cli_prerequisites.outcome == 'failure' || steps.formatter_prerequisites.outcome == 'failure' || steps.retail_stage.outcome == 'failure' || steps.retail_gate.outcome == 'failure' || steps.retail_checkout.outcome == 'failure') && steps.execute.outcome == 'skipped' }}
        run: |
          blocked=()
          if [[ "$SETUP_FAILED" == true ]]; then blocked=(--blocked-reason 'host lane provisioning failed; inspect setup logs'); fi
          if [[ "$NIGHTLY_SAMPLE" == true ]]; then
            python3 control/android/tests/nightly_sample.py collect --lane host "${blocked[@]}"
            exit $?
          fi
          python3 control/android/tests/nightly_tooling_sweep.py collect \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --lane host --output results "${blocked[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && !matrix.retail
        with:
          name: nightly-results-host${{ matrix.shard != '' && format('-{0}', matrix.shard) || '' }}
          path: |
            results/
            !results/build/**
          retention-days: 14
          if-no-files-found: warn
      - name: Upload retail-safe owner receipts
        if: always() && matrix.retail
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-results-host${{ matrix.shard != '' && format('-{0}', matrix.shard) || '' }}
          path: |
            results/results.json
            results/retail-verification.json
          retention-days: 14
          if-no-files-found: warn

  pumo_stage:
    name: Verify pinned Pumo staging
    outputs:
      execution_result: ${{ steps.execution.outcome }}
    needs: [stack, plan]
    if: always() && needs.stack.outputs.run == 'true' && (needs.plan.outputs.supplemental == 'pumo-stage' || (github.event_name == 'workflow_dispatch' && inputs.campaign == 'pumo-stage'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    # The controller is trusted only after this exact workflow reaches cmake.
    environment:
      name: ${{ github.repository == 'larsonm-personal/dxx-redux' && github.ref == 'refs/heads/cmake' && github.workflow_ref == 'larsonm-personal/dxx-redux/.github/workflows/nightly-tooling-sweep.yml@refs/heads/cmake' && 'retail-ci' || 'asset-free' }}
      deployment: ${{ github.repository == 'larsonm-personal/dxx-redux' && github.ref == 'refs/heads/cmake' && github.workflow_ref == 'larsonm-personal/dxx-redux/.github/workflows/nightly-tooling-sweep.yml@refs/heads/cmake' }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Reject candidate inputs and verify trusted gate
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, sys
          sys.path.insert(0, 'control/android/tests')
          import nightly_retail
          assert os.environ['CANDIDATE_CAMPAIGN'] == 'pumo-stage' or os.environ['NIGHTLY_SAMPLE'] == 'true'
          assert not os.environ['CANDIDATE_PR'] and not os.environ['CANDIDATE_SHA']
          assert nightly_retail.trusted_context()
          PYTHON
      - name: Install bounded extraction prerequisite
        run: |
          set -euo pipefail
          python3 control/.github/scripts/prefer_ubuntu_archive.py
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libarchive13t64
          python3 -m venv "$RUNNER_TEMP/pumo-stage-python"
          "$RUNNER_TEMP/pumo-stage-python/bin/python" -m pip install 'libarchive-c==5.3'
          "$RUNNER_TEMP/pumo-stage-python/bin/python" -m pip check
      - name: Check private credential availability
        env:
          TOKEN_AVAILABLE: ${{ secrets.RETAIL_ASSETS_READ_TOKEN != '' }}
        run: test "$TOKEN_AVAILABLE" = true
      - name: Check out separate immutable full Pumo inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: larsonm-personal/dxx-redux-test-assets
          ref: dc6565f6b5400d7c700fa8378e766b2354b6ceb6
          token: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}
          path: pumo-input
          persist-credentials: false
          sparse-checkout: |
            pumo-full/
            tools/pumo-full/archive.py
            xl-resources/d2x-xl.hog
            xl-resources/manifest.json
          sparse-checkout-cone-mode: false
      - name: Verify private pins and stage into fresh temporary storage
        id: execution
        run: |
          set -euo pipefail
          test "$(git -C pumo-input rev-parse HEAD)" = dc6565f6b5400d7c700fa8378e766b2354b6ceb6
          test "$(git -C pumo-input hash-object pumo-full/manifest.json)" = 0e9667afdab347338fe3e6f186530f435bfc66ad
          test "$(git -C pumo-input hash-object tools/pumo-full/archive.py)" = 27c297f214437536b081fe3538d28d2a299e6939
          test "$(git -C pumo-input hash-object xl-resources/d2x-xl.hog)" = e0ae5bf48bdc097838bd96f0e11df5f6abca14e4
          test "$(git -C pumo-input hash-object xl-resources/manifest.json)" = f3d009587180a0c3fb96ab2d32b979c27b552029
          mkdir "$RUNNER_TEMP/pumo-pinned-stage"
          "$RUNNER_TEMP/pumo-stage-python/bin/python" control/android/tests/pumo_private_assets.py \
            --root "$PWD/pumo-input" --archive "$RUNNER_TEMP/pumo-pinned-stage/pmines_v11.7z" \
            --stage "$RUNNER_TEMP/pumo-pinned-stage/runtime"
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'pumo-pinned-stage/runtime'
          files = [path for path in root.rglob('*') if path.is_file()]
          assert len(files) == 2670
          assert sum(path.stat().st_size for path in files) == 1677395717
          print('Pinned Pumo staging verified: 2670 files')
          PYTHON
      - name: Remove only owned temporary private copies
        if: always()
        run: |
          rm -rf -- "$PWD/pumo-input" "$RUNNER_TEMP/pumo-pinned-stage" "$RUNNER_TEMP/pumo-stage-python"
      # No candidate checkout, executable, original resource or private artifact is published.

  execution-stack:
    needs: plan
    uses: ./.github/workflows/stack-ci.yml

  nightly_release:
    name: Nightly XL developer Release compile
    outputs:
      execution_result: ${{ steps.execution.outcome }}
    needs: plan
    if: needs.plan.outputs.supplemental == 'release-compile'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          path: target
          persist-credentials: false
      - name: Install Release build dependencies
        run: |
          python3 control/.github/scripts/prefer_ubuntu_archive.py
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev libglew-dev libsdl1.2-dev libsdl-mixer1.2-dev libphysfs-dev libpng-dev zlib1g-dev
          mkdir -p "$RUNNER_TEMP/dxx-nightly-deps"
          printf '%s\n' "$RUNNER_TEMP/dxx-nightly-deps" > target/dependency_base.txt
      - name: Compile and verify exact candidate Release target
        id: execution
        run: |
          cmake -S target/d2 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF -DOPENGL=ON -DOpenGL_GL_PREFERENCE=LEGACY -DDXX_XL_DEVELOPER_TESTS=ON
          cmake --build build --parallel 2 --target dxx-redux-d2-headless-metadata
          python3 control/android/XL_compat/tests/developer_compile_ci.py --verify-build build --mode Release

  android:
    name: ${{ matrix.lane == 'jvm' && 'JVM tests' || matrix.lane == 'android-dual' && 'Multi-device tests' || 'Android tests' }}
    needs: [plan, execution-stack]
    if: needs.execution-stack.outputs.run == 'true' && needs.plan.outputs.android_lanes != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3 # Plus the separate host executor: at most four test lanes.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.android_matrix) }}
    uses: ./.github/workflows/android-nightly-tooling.yml
    with:
      target_sha: ${{ needs.plan.outputs.target_sha }}
      shard: ${{ matrix.shard }}
      nightly_target_ref: ${{ needs.plan.outputs.target_ref }}
      nightly_activity_id: ${{ needs.plan.outputs.activity_id }}
      plan_artifact: nightly-plan
      lane: ${{ matrix.lane }}
      retail_assets: ${{ matrix.retail }}
      retail_commit: ${{ needs.plan.outputs.retail_commit }}
    # Explicitly name the environment-only secret; the callee keeps its trusted retail-ci gate
    secrets:
      RETAIL_ASSETS_READ_TOKEN: ${{ secrets.RETAIL_ASSETS_READ_TOKEN }}

  finish:
    name: Check results
    needs: [plan, execution-stack, host, android, pumo_stage, nightly_release]
    outputs:
      reconciled: ${{ steps.reconcile.outcome == 'success' }}
    if: always() && needs.plan.result == 'success' && (needs.execution-stack.outputs.run != 'false' || needs.host.result == 'failure' || needs.host.result == 'cancelled' || needs.android.result == 'failure' || needs.android.result == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-plan
          path: plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: nightly-results-*
          path: receipts
      - name: Reconcile terminal results and retain unresolved failures
        id: reconcile
        env:
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          HOST_RESULT: ${{ needs.host.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          EXECUTION_STACK_RESULT: ${{ needs.execution-stack.result }}
          PUMO_STAGE_RESULT: ${{ needs.pumo_stage.outputs.execution_result }}
          RELEASE_COMPILE_RESULT: ${{ needs.nightly_release.outputs.execution_result }}
          REQUIRE_SELECTED: ${{ inputs.campaign == 'online-preview' || inputs.campaign == 'online-preview-d2' || inputs.campaign == 'online-transports' || github.event_name == 'pull_request' || inputs.campaign == 'first-play' || inputs.campaign == 'graphics-capabilities' || inputs.campaign == 'xl-browser' || inputs.campaign == 'xl-textures' || inputs.campaign == 'basic-use' || inputs.campaign == 'xl-originals' || inputs.campaign == 'xl-fast' }}
        run: |
          if [[ "$NIGHTLY_SAMPLE" == true ]]; then
            status=0
            python3 control/android/tests/nightly_sample.py report || status=$?
            { echo '## Nightly sample receipts'; echo '```json'; cat summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          qualification=()
          if [[ "$REQUIRE_SELECTED" == 'true' ]]; then qualification=(--require-selected); fi
          status=0
          mapfile -t receipts < <(find receipts -mindepth 1 -maxdepth 2 -type f \( -path 'receipts/results.json' -o -path 'receipts/nightly-results-*/results.json' \) 2>/dev/null | sort)
          python3 control/android/tests/nightly_tooling_sweep.py reconcile \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --state plan/state.json --output summary-state.json "${qualification[@]}" --receipts "${receipts[@]}" > summary.json || status=$?
          {
            echo '## Nightly tooling sweep'
            echo 'Exact target, completed owners, unresolved failures, blocked suites and exclusions:'
            echo '```json'
            cat summary.json
            echo '```'
            echo 'No result means pending. Infrastructure blockages are not coverage and retry next night; stable exclusions remain explicit.'
            echo 'A completed sweep stops selecting tests until the target or admitted catalog changes.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: nightly-sweep-summary
          path: |
            summary.json
            summary-state.json
            published-state.json
          retention-days: 30

      - name: Require no unresolved failures or infrastructure blocks
        if: always() && steps.reconcile.outcome == 'success' && env.NIGHTLY_SAMPLE != 'true'
        env:
          EXECUTION_STACK_RESULT: ${{ needs.execution-stack.result }}
          HOST_RESULT: ${{ needs.host.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          summary = json.loads(Path('summary.json').read_text())
          failures = summary['failures']
          blocked = summary['retryable_infrastructure']
          lanes_failed = any(os.environ[key] in ('failure', 'cancelled')
                             for key in ('EXECUTION_STACK_RESULT', 'HOST_RESULT', 'ANDROID_RESULT'))
          if failures or blocked or lanes_failed:
              print(f'::error::{len(failures)} unresolved test failures; {len(blocked)} infrastructure blocks; failed or cancelled lane: {lanes_failed}')
              raise SystemExit(1)
          print('No unresolved failures or infrastructure blocks; unattempted work remains pending')
          PYTHON

  publish:
    name: Save nightly progress (scheduled/manual only)
    needs: [plan, finish, pumo_stage, nightly_release]
    if: always() && needs.plan.result == 'success' && (github.event_name == 'schedule' || inputs.campaign == 'nightly' || needs.finish.outputs.reconciled == 'true') && github.event_name != 'workflow_run' && github.event_name != 'pull_request' && inputs.campaign != 'first-play' && inputs.campaign != 'graphics-capabilities' && inputs.campaign != 'xl-browser' && inputs.campaign != 'xl-textures' && inputs.campaign != 'xl-originals' && inputs.campaign != 'xl-fast' && inputs.campaign != 'basic-use' && inputs.campaign != 'online-preview' && inputs.campaign != 'online-preview-d2' && inputs.campaign != 'online-transports' && (github.ref == 'refs/heads/cmake' || (github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-plan
          path: plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: nightly-results-*
          path: receipts
      - name: Publish only completed progress to dedicated state branch
        env:
          GH_TOKEN: ${{ github.token }}
          PUMO_STAGE_RESULT: ${{ needs.pumo_stage.outputs.execution_result }}
          RELEASE_COMPILE_RESULT: ${{ needs.nightly_release.outputs.execution_result }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        run: |
          mapfile -t receipts < <(find receipts -mindepth 1 -maxdepth 2 -type f \( -path 'receipts/results.json' -o -path 'receipts/nightly-results-*/results.json' \) 2>/dev/null | sort)
          if [[ "$NIGHTLY_SAMPLE" == true ]]; then
            python3 control/android/tests/nightly_sample.py publish
            exit $?
          fi
          python3 control/android/tests/nightly_tooling_sweep.py publish \
            --plan plan/plan.json --policy control/android/tests/nightly_tooling_policy.json \
            --expected-target "$TARGET_SHA" --output published-state.json --receipts "${receipts[@]}"
