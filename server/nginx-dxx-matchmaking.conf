# nginx reverse proxy for dxx-matchmaking
# TLS termination with Let's Encrypt, proxying to the local matchmaking server.
# Generated by deploy_build.sh -- edit DOMAIN placeholders before use.

# WebSocket server (wss:// on port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # WebSocket endpoint
    location /ws {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Google login shares the WSS origin and listener, not the public status API
    location ^~ /api/v1/auth/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12k;
        client_body_timeout 5s;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 6s;
        proxy_send_timeout 6s;
    }

    # HTTP API
    location /api/ {
        proxy_pass http://127.0.0.1:18080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static landing page is independent of daemon readiness
    root /var/www/dxx-landing;
    location = / {
        try_files /index.html =503;
    }
    location = /index.html { try_files /index.html =404; }
    location / { return 404; }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/dxx-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
