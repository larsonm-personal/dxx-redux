[package]
name = "dxx-matchmaking"
version = "0.1.0"
edition = "2021"

[dependencies]
ring = "=0.17.14"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = "=0.23.46"
tokio-rustls = "=0.26.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", features = ["rustls", "json", "form"], default-features = false }
dashmap = "=6.2.1"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tracing-appender = "=0.2.5"
futures-util = "=0.3.34"
axum = { version = "=0.8.9", features = ["ws"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chrono = { version = "=0.4.45", features = ["serde"] }
rustls-pemfile = "=2.2.0"
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
sha2 = "=0.11.1"
rand = { version = "=0.10.3", features = ["sys_rng"] }
hex = "=0.4.3"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server-auto", "http1", "service"] }
tower = "=0.5.3"

[[bin]]
name = "nat-sim"
path = "src/bin/nat_sim.rs"

[dev-dependencies]
tempfile = "=3.27.0"
