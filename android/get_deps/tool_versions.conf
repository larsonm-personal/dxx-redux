PYTHON_EMBED_URL=https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip
VIRTUALENV_VERSION=21.3.3
VIRTUALENV_PYZ_URL=https://github.com/pypa/virtualenv/releases/download/21.3.3/virtualenv.pyz

