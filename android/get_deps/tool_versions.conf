# cheshirekow/cmakelang provides cmake-format + cmake-lint as a Python package.
# On Windows we bootstrap a Python embed distribution alongside the package so
# the install is self-contained. On Linux/macOS we prefer host python3's venv
# module and fall back to a pinned virtualenv.pyz when distros strip venv.
CMAKELANG_VERSION=0.6.13
CMAKELANG_INSTALLED_VERSION_CMD='Get-LatestInstalledDirectoryVersion $dependency_base "cmakelang-*" "^cmakelang-(.+)$"'
CMAKELANG_INSTALL_CMD='Invoke-InstallerScript "$script_dir/helpers/get_cmake_format.sh"'
