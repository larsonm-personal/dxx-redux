# Project-wide Gradle settings.
android.useAndroidX=true
# Keep dependency R classes in the APK.  Startup-runtime reads its own
# androidx.startup.R.string.androidx_startup before Application.onCreate;
# AGP's non-transitive R optimization omitted that class from this app's
# multidex output even though the resource and provider were packaged.
android.nonTransitiveRClass=false
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true

# Set to false to build with software rendering instead of OpenGL ES
useOpenGL=true
