plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Load tool versions from central config
def toolVersions = new Properties()
toolVersions.load(new FileInputStream(rootProject.file("get_deps/tool_versions.conf")))

// Load keystore.properties if it exists (for release signing)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Derive versionCode from git commit count
def gitVersionCode = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootProject.projectDir.parentFile)
        proc.waitFor()
        def result = proc.text.trim()
        if (result && result.isInteger()) {
            return result.toInteger()
        }
        logger.warn("git rev-list output was not an integer: '${result}', stderr: '${proc.err.text}'")
        return 1
    } catch (Exception e) {
        logger.warn("Could not get git commit count (${e.message}), using versionCode=1")
        return 1
    }
}()

// ── Download GM soundfont if missing or hash mismatch ────────────────────────
def soundfontFile = file('src/main/assets/gm.sf2')
def soundfontUrl = toolVersions['SOUNDFONT_URL']
def soundfontSha = toolVersions['SOUNDFONT_SHA256']

tasks.register('downloadSoundfont') {
    description = 'Download GM soundfont (TimGM6mb.sf2) into assets if missing or wrong hash'
    outputs.file(soundfontFile)

    doLast {
        if (soundfontFile.exists()) {
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            soundfontFile.withInputStream { is -> digest.update(is.bytes) }
            def actual = digest.digest().collect { String.format('%02x', it) }.join()
            if (actual == soundfontSha) {
                logger.lifecycle("Soundfont up-to-date: ${soundfontFile}")
                return
            }
            logger.lifecycle("Soundfont hash mismatch — re-downloading")
            soundfontFile.delete()
        }
        soundfontFile.parentFile.mkdirs()
        logger.lifecycle("Downloading TimGM6mb.sf2...")
        new URL(soundfontUrl).withInputStream { is -> soundfontFile.withOutputStream { os -> os << is } }

        // verify
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        soundfontFile.withInputStream { is -> digest.update(is.bytes) }
        def actual = digest.digest().collect { String.format('%02x', it) }.join()
        if (actual != soundfontSha) {
            soundfontFile.delete()
            throw new GradleException("Soundfont SHA-256 mismatch!\n  Expected: ${soundfontSha}\n  Got:      ${actual}")
        }
        logger.lifecycle("Soundfont downloaded and verified.")
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('externalNativeBuild') || task.name.startsWith('configureCMake') ||
        task.name.startsWith('buildCMake') || task.name == 'preBuild') {
        task.dependsOn('downloadSoundfont')
    }
}

android {
    namespace 'com.dxxredux.app'
    compileSdk toolVersions['COMPILE_SDK'].toInteger()
    ndkVersion toolVersions['NDK_FULL_VERSION']
    ndkPath System.getenv('ANDROID_NDK_ROOT') ?: "C:/local/android-ndk-${toolVersions['NDK_VERSION']}"

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.dxxredux.app"
        minSdk toolVersions['MIN_SDK'].toInteger()
        targetSdk toolVersions['TARGET_SDK'].toInteger()
        versionCode gitVersionCode
        versionName "1.1"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1+'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.core:core-ktx:${toolVersions['CORE_KTX_VERSION']}"
    implementation "androidx.appcompat:appcompat:${toolVersions['APPCOMPAT_VERSION']}"
    implementation "androidx.activity:activity-compose:${toolVersions['ACTIVITY_COMPOSE_VERSION']}"
    implementation platform("androidx.compose:compose-bom:${toolVersions['COMPOSE_BOM_VERSION']}")
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
}
