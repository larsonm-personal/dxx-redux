plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Load tool versions from central config
def toolVersions = new Properties()
toolVersions.load(new FileInputStream(rootProject.file("get_deps/tool_versions.conf")))

// Load keystore.properties if it exists (for release signing)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Load auth_config.json5 if it exists (for GPGS sign-in)
// Strip // comments and trailing commas to make it valid JSON, then parse.
def authConfigFile = rootProject.file("auth_config.json5")
def authServerClientId = ""
def authGamesAppId = "000000000000"
if (authConfigFile.exists()) {
    def json5Text = authConfigFile.text
    def jsonText = json5Text
        .replaceAll('(?m)//.*$', '')       // strip line comments
        .replaceAll(',\\s*([}\\]])', '$1') // strip trailing commas
    def parsed = new groovy.json.JsonSlurper().parseText(jsonText)
    authServerClientId = parsed.server_client_id ?: ""
    authGamesAppId = parsed.games_app_id ?: "000000000000"
    logger.lifecycle("auth_config.json5: server_client_id=${authServerClientId.take(20)}..., games_app_id=$authGamesAppId")
} else {
    logger.lifecycle("auth_config.json5 not found — GPGS sign-in will be disabled (dev token fallback)")
}

// Derive versionCode from git commit count
def gitVersionCode = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootProject.projectDir.parentFile)
        proc.waitFor()
        def result = proc.text.trim()
        if (result && result.isInteger()) {
            return result.toInteger()
        }
        logger.warn("git rev-list output was not an integer: '${result}', stderr: '${proc.err.text}'")
        return 1
    } catch (Exception e) {
        logger.warn("Could not get git commit count (${e.message}), using versionCode=1")
        return 1
    }
}()

// ── Download GM soundfont if missing or hash mismatch ────────────────────────
def soundfontFile = file('src/main/assets/gm.sf2')
def soundfontUrl = toolVersions['SOUNDFONT_URL']
def soundfontSha = toolVersions['SOUNDFONT_SHA256']

tasks.register('downloadSoundfont') {
    description = 'Download GM soundfont (TimGM6mb.sf2) into assets if missing or wrong hash'
    outputs.file(soundfontFile)

    doLast {
        if (soundfontFile.exists()) {
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            soundfontFile.withInputStream { is -> digest.update(is.bytes) }
            def actual = digest.digest().collect { String.format('%02x', it) }.join()
            if (actual == soundfontSha) {
                logger.lifecycle("Soundfont up-to-date: ${soundfontFile}")
                return
            }
            logger.lifecycle("Soundfont hash mismatch — re-downloading")
            soundfontFile.delete()
        }
        soundfontFile.parentFile.mkdirs()
        logger.lifecycle("Downloading TimGM6mb.sf2...")
        new URL(soundfontUrl).withInputStream { is -> soundfontFile.withOutputStream { os -> os << is } }

        // verify
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        soundfontFile.withInputStream { is -> digest.update(is.bytes) }
        def actual = digest.digest().collect { String.format('%02x', it) }.join()
        if (actual != soundfontSha) {
            soundfontFile.delete()
            throw new GradleException("Soundfont SHA-256 mismatch!\n  Expected: ${soundfontSha}\n  Got:      ${actual}")
        }
        logger.lifecycle("Soundfont downloaded and verified.")
    }
}

// ── Generate BuildInfo.kt with dev defaults if not already present ────────────
def buildInfoFile = file('src/main/java/com/dxxredux/app/BuildInfo.kt')

tasks.register('generateBuildInfo') {
    description = 'Generate BuildInfo.kt with dev placeholder values (skipped if file already exists)'
    outputs.file(buildInfoFile)

    doLast {
        if (buildInfoFile.exists()) {
            logger.lifecycle("BuildInfo.kt already present — skipping generation")
            return
        }
        buildInfoFile.parentFile.mkdirs()
        buildInfoFile.text = '''\
package com.dxxredux.app

/**
 * Build metadata — regenerated by build-aab.ps1 / build-aab.sh before release builds.
 * For local dev builds this contains placeholder values.
 *
 * This file is not tracked in git. It is generated by the Gradle generateBuildInfo task
 * with dev defaults, or overwritten by build-aab scripts with real values.
 */
object BuildInfo {
    const val GIT_COMMIT_COUNT = "dev"
    const val GIT_SHORT_HASH   = "dev"
    const val BUILD_DATE       = "dev"
    const val BUILD_TIME       = "dev"
    const val BUILD_TYPE       = "dev"
}
'''
        logger.lifecycle("Generated BuildInfo.kt with dev defaults")
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('externalNativeBuild') || task.name.startsWith('configureCMake') ||
        task.name.startsWith('buildCMake') || task.name == 'preBuild') {
        task.dependsOn('downloadSoundfont')
    }
    if (task.name.startsWith('compile') && task.name.contains('Kotlin')) {
        task.dependsOn('generateBuildInfo')
    }
}

// Load dependency base path
def depBaseFile = rootProject.file("../dependency_base.txt")
def depBase = depBaseFile.exists() ? depBaseFile.text.trim().replace('\\', '/') : null

android {
    namespace 'com.dxxredux.app'
    compileSdk toolVersions['COMPILE_SDK'].toInteger()
    ndkVersion toolVersions['NDK_FULL_VERSION']
    ndkPath System.getenv('ANDROID_NDK_ROOT') ?: (depBase ? "${depBase}/android-ndk-${toolVersions['NDK_VERSION']}" : null)

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.dxxredux.app"
        minSdk toolVersions['MIN_SDK'].toInteger()
        targetSdk toolVersions['TARGET_SDK'].toInteger()
        versionCode gitVersionCode
        versionName "1.1"

        def opengl = (project.findProperty('useOpenGL') ?: 'true') == 'true'
        buildConfigField "String", "RENDERER", "\"${opengl ? 'OpenGL ES' : 'Software'}\""
        buildConfigField "String", "GPGS_SERVER_CLIENT_ID", "\"${authServerClientId}\""

        // GPGS APP_ID for AndroidManifest meta-data
        manifestPlaceholders["gamesAppId"] = authGamesAppId

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                          "-DANDROID_USE_OPENGL=${project.findProperty('useOpenGL') ?: 'true'}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version toolVersions['CMAKE_VERSION'] + '+'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        freeCompilerArgs.addAll(['-Xsam-conversions=class'])
        allWarningsAsErrors = false
    }
}

dependencies {
    implementation "androidx.core:core-ktx:${toolVersions['CORE_KTX_VERSION']}"
    implementation "androidx.appcompat:appcompat:${toolVersions['APPCOMPAT_VERSION']}"
    implementation "androidx.activity:activity-compose:${toolVersions['ACTIVITY_COMPOSE_VERSION']}"
    implementation platform("androidx.compose:compose-bom:${toolVersions['COMPOSE_BOM_VERSION']}")
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui'

    // Networking / Multiplayer
    implementation "com.squareup.okhttp3:okhttp:${toolVersions['OKHTTP_VERSION']}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${toolVersions['KOTLINX_SERIALIZATION_VERSION']}"

    // Google Play Games Services (GPGS v2) for player identity
    implementation "com.google.android.gms:play-services-games-v2:${toolVersions['PLAY_SERVICES_GAMES_VERSION']}"

    // 7z archive support (for music packs distributed as .7z)
    implementation "org.apache.commons:commons-compress:${toolVersions['COMMONS_COMPRESS_VERSION']}"
}
