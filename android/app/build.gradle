plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Load tool versions from central config
def toolVersions = new Properties()
toolVersions.load(new FileInputStream(rootProject.file("get_deps/tool_versions.conf")))

// Load keystore.properties if it exists (for release signing)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Derive versionCode from git commit count
def gitVersionCode = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootProject.projectDir.parentFile)
        proc.waitFor()
        def result = proc.text.trim()
        if (result && result.isInteger()) {
            return result.toInteger()
        }
        logger.warn("git rev-list output was not an integer: '${result}', stderr: '${proc.err.text}'")
        return 1
    } catch (Exception e) {
        logger.warn("Could not get git commit count (${e.message}), using versionCode=1")
        return 1
    }
}()

android {
    namespace 'com.dxxredux.app'
    compileSdk toolVersions['COMPILE_SDK'].toInteger()
    ndkVersion toolVersions['NDK_FULL_VERSION']
    ndkPath System.getenv('ANDROID_NDK_ROOT') ?: "C:/local/android-ndk-${toolVersions['NDK_VERSION']}"

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.dxxredux.app"
        minSdk toolVersions['MIN_SDK'].toInteger()
        targetSdk toolVersions['TARGET_SDK'].toInteger()
        versionCode gitVersionCode
        versionName "1.1"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1+'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.core:core-ktx:${toolVersions['CORE_KTX_VERSION']}"
    implementation "androidx.appcompat:appcompat:${toolVersions['APPCOMPAT_VERSION']}"
    implementation "androidx.activity:activity-compose:${toolVersions['ACTIVITY_COMPOSE_VERSION']}"
    implementation platform("androidx.compose:compose-bom:${toolVersions['COMPOSE_BOM_VERSION']}")
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
}
