pluginManagement {
    // Load tool versions from central config
    def toolVersions = new Properties()
    toolVersions.load(new FileInputStream(new File(rootDir, "get_deps/tool_versions.conf")))

    repositories {
        if (!providers.gradleProperty('hostJvmOnly').getOrElse('false').toBoolean()) google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version toolVersions['AGP_VERSION']
        id 'org.jetbrains.kotlin.plugin.compose' version toolVersions['KOTLIN_VERSION']
        id 'org.jetbrains.kotlin.plugin.serialization' version toolVersions['KOTLIN_VERSION']
        id 'org.jetbrains.kotlin.jvm' version toolVersions['KOTLIN_VERSION']
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (!providers.gradleProperty('hostJvmOnly').getOrElse('false').toBoolean()) google()
        mavenCentral()
    }
}

// Pure JVM modules use their existing builds without resolving AGP or an Android SDK
def hostJvmOnly = providers.gradleProperty('hostJvmOnly').getOrElse('false').toBoolean()
if (hostJvmOnly) rootProject.buildFileName = 'host-jvm.gradle'

// Auto-generate local.properties from dependency_base.txt if it doesn't exist
def localPropsFile = new File(rootDir, "local.properties")
if (!hostJvmOnly && !localPropsFile.exists()) {
    def depBaseFile = new File(rootDir, "../dependency_base.txt")
    if (depBaseFile.exists()) {
        def depBase = depBaseFile.text.trim().replace('\\', '/')
        localPropsFile.text = "# Auto-generated from dependency_base.txt\nsdk.dir=${depBase}/android-sdk\n"
    }
}

rootProject.name = "dxx-redux"
if (!hostJvmOnly) include ':app'
include ':mission-metadata-core'
include ':mission-metadata-cli'
include ':proxy-tests'
